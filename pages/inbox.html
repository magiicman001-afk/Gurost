<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inbox — Gurost</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="shared/styles.css" rel="stylesheet"/>
<style>
  .inbox-layout { display: grid; grid-template-columns: 320px 1fr; gap: 16px; height: calc(100vh - 180px); }
  .conv-list { overflow-y: auto; border: 1px solid var(--outline-variant); border-radius: 12px; }
  .conv-item { padding: 14px; border-bottom: 1px solid var(--outline-variant); cursor: pointer; }
  .conv-item:hover { background: var(--surface-container-low); }
  .conv-item.active { background: var(--tertiary-container, #FFF3E0); }
  .conv-phone { font-weight: 600; font-size: 13px; }
  .conv-preview { font-size: 12px; color: var(--on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thread { display: flex; flex-direction: column; border: 1px solid var(--outline-variant); border-radius: 12px; padding: 16px; overflow-y: auto; gap: 8px; }
  .msg { max-width: 70%; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  .msg.inbound { align-self: flex-start; background: var(--surface-container-low); }
  .msg.outbound { align-self: flex-end; background: var(--tertiary-container, #FFF3E0); }
  .empty-state { color: var(--on-surface-variant); font-size: 13px; text-align: center; margin-top: 40px; }
</style>
</head>
<body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen">

<nav class="bg-surface-container-lowest/80 backdrop-blur-md text-primary font-body-md docked full-width top-0 sticky border-b border-outline-variant/30 shadow-sm flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 max-w-container-max mx-auto z-50">
<div class="flex items-center gap-4">
<a href="dashboard.html" class="flex items-center gap-4">
<img alt="Gurost Logo" class="h-10 w-auto object-contain rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCKX7OEmVO7BAqh5zSnqJsLoGDgdZQ0KjVOl6XXAF23sRfCo5MKU577jkFX_CgnGtSIwLfQJ2w-ZnNRuGYK4HXuKmZeA3zDIidU6XhbLip9YcBTsLAsAqO-7nBrG9DmxgZZpIo0XSC8n8IfJHTDcaX1Y-xS4fDiDUYeaVdPa-9xD_4b9OyqqntrRzHvCursskogPuSa8tjyMIhVCHDId7Zpt_1H1NVLI6OGrSThNorkk4oUXk5Q2ptS_uYx1cxH1ro8CI"/>
<span class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight hidden md:block">Gurost</span>
</a>
</div>
<div class="flex items-center gap-4">
<a class="text-on-surface-variant hover:text-on-surface font-label-sm text-label-sm px-4 py-2 rounded-full hover:bg-surface-container-low transition-all duration-200" href="dashboard.html">Dashboard</a>
</div>
</nav>

<main class="flex-grow w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop py-8">
<div class="mb-4">
<h1 class="font-headline-md text-headline-md font-bold text-on-surface">Inbox</h1>
<p class="text-on-surface-variant text-sm mt-1">WhatsApp conversations right now — real, not a mockup of a fuller unified inbox. Email and web chat aren't wired into this view yet; each would need its own real data source connected first.</p>
</div>

<div class="inbox-layout">
<div class="conv-list" id="convList"><div class="empty-state">Loading…</div></div>
<div class="thread" id="threadView"><div class="empty-state">Select a conversation to view it.</div></div>
</div>
</main>

<script src="shared/api-client.js"></script>
<script>
if (!GurostAPI.requireLogin()) {
  throw new Error('Not logged in — redirecting.');
}

let activePhone = null;

async function loadConversations() {
  const listEl = document.getElementById('convList');
  try {
    const conversations = await GurostAPI.call('/api/whatsapp/conversations');
    if (!conversations.length) {
      listEl.innerHTML = '<div class="empty-state">No WhatsApp conversations yet.</div>';
      return;
    }
    listEl.innerHTML = conversations.map((c) => `
      <div class="conv-item" data-phone="${c.customer_phone}">
        <div class="conv-phone">${c.customer_phone}</div>
        <div class="conv-preview">${c.direction === 'outbound' ? 'You: ' : ''}${c.message_body}</div>
      </div>
    `).join('');
    listEl.querySelectorAll('.conv-item').forEach((el) => {
      el.addEventListener('click', () => openThread(el.dataset.phone, el));
    });
  } catch (err) {
    listEl.innerHTML = `<div class="empty-state">Couldn't load conversations: ${err.message}</div>`;
  }
}

async function openThread(phone, el) {
  document.querySelectorAll('.conv-item').forEach((e) => e.classList.remove('active'));
  el.classList.add('active');
  activePhone = phone;

  const threadEl = document.getElementById('threadView');
  threadEl.innerHTML = '<div class="empty-state">Loading…</div>';
  try {
    const messages = await GurostAPI.call(`/api/whatsapp/conversations/${encodeURIComponent(phone)}`);
    threadEl.innerHTML = messages.map((m) => `<div class="msg ${m.direction}">${m.message_body}</div>`).join('') || '<div class="empty-state">No messages.</div>';
    threadEl.scrollTop = threadEl.scrollHeight;
  } catch (err) {
    threadEl.innerHTML = `<div class="empty-state">Couldn't load this conversation: ${err.message}</div>`;
  }
}

loadConversations();
</script>
</body>
</html>
