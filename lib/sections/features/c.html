<section class="g-sec g-features g-features--c" id="features" data-gurost-section="features" data-variant="c" data-tone="light">
  <div class="g-container">
    <div class="g-head" data-g-reveal="up" data-gsap-fade>{{#if eyebrow}}<p class="g-eyebrow">{{eyebrow}}</p>{{/if}}<h2 class="g-title">{{title}}</h2>{{#if intro}}<p class="g-lead">{{intro}}</p>{{/if}}</div>
    <ul class="g-features__bento">{{#each items}}<li class="g-features__item" data-g-reveal="up" data-g-stagger data-gsap-slide><span class="g-icon">{{{icon_svg}}}</span><h3 class="g-features__name">{{title}}</h3><p class="g-features__text">{{text}}</p></li>{{/each}}</ul>
  </div>
</section>
