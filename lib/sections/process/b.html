<section class="g-sec g-sec--surface g-process g-process--b" id="process" data-gurost-section="process" data-variant="b" data-tone="light">
  <div class="g-container">
    <div class="g-process__layout"><div class="g-head" data-g-reveal="up" data-gsap-fade>{{#if eyebrow}}<p class="g-eyebrow">{{eyebrow}}</p>{{/if}}<h2 class="g-title">{{title}}</h2>{{#if intro}}<p class="g-lead">{{intro}}</p>{{/if}}</div>
    <ol class="g-process__list">{{#each steps}}<li class="g-process__step" data-g-reveal="up" data-g-stagger data-gsap-slide><span class="g-process__num" aria-hidden="true">{{@n}}</span><div class="g-process__body"><h3 class="g-process__name">{{title}}</h3>{{#if text}}<p class="g-process__text">{{text}}</p>{{/if}}</div></li>{{/each}}</ol></div>
  </div>
</section>
