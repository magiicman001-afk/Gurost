<section class="g-sec g-about g-about--a" id="about" data-gurost-section="about" data-variant="a" data-tone="light">
  <div class="g-container">
    <div class="g-about__grid"><figure class="g-about__media" data-g-parallax="subtle"><img class="g-about__img" src="{{image}}" alt="{{image_alt}}" {{#if image_brief}}data-gurost-image="{{image_brief}}" {{/if}}data-gurost-image-role="about" loading="lazy" decoding="async"></figure><div class="g-about__text" data-g-reveal="up" data-gsap-slide>{{#if eyebrow}}<p class="g-eyebrow">{{eyebrow}}</p>{{/if}}<h2 class="g-title">{{title}}</h2><p class="g-about__body">{{body}}</p>{{#if body2}}<p class="g-about__body">{{body2}}</p>{{/if}}{{#if points}}<ul class="g-about__points">{{#each points}}<li>{{text}}</li>{{/each}}</ul>{{/if}}{{#if cta_label}}{{#if cta_href}}<a class="g-btn g-btn--primary g-about__cta" href="{{cta_href}}">{{cta_label}}</a>{{/if}}{{/if}}</div></div>
  </div>
</section>
