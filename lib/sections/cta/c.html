<section class="g-sec g-cta g-cta--c" id="cta" data-gurost-section="cta" data-variant="c" data-tone="dark">
  <div class="g-container">
    <div class="g-cta__inner" data-g-reveal="up" data-gsap-fade><div class="g-cta__copy"><h2 class="g-title g-cta__title">{{title}}</h2>{{#if text}}<p class="g-lead g-cta__text">{{text}}</p>{{/if}}</div><div class="g-cta__actions">{{#if cta1_label}}{{#if cta1_href}}<a class="g-btn g-btn--inverse" href="{{cta1_href}}">{{cta1_label}}</a>{{/if}}{{/if}}{{#if cta2_label}}{{#if cta2_href}}<a class="g-btn g-btn--outline" href="{{cta2_href}}">{{cta2_label}}</a>{{/if}}{{/if}}</div></div>
  </div>
</section>
