<section class="g-sec g-sec--tight g-sec--surface g-trustbar g-trustbar--a" data-gurost-section="trust-bar" data-variant="a" data-tone="light">
  <div class="g-container">
    <ul class="g-trustbar__list">{{#each items}}<li class="g-trustbar__item" data-g-reveal="up" data-g-stagger data-gsap-slide><span class="g-icon g-trustbar__icon">{{{icon_svg}}}</span><span class="g-trustbar__text"><strong class="g-trustbar__label">{{label}}</strong>{{#if detail}}<span class="g-trustbar__detail">{{detail}}</span>{{/if}}</span></li>{{/each}}</ul>
  </div>
</section>
