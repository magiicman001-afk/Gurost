<section class="g-sec g-faq g-faq--c" id="faq" data-gurost-section="faq" data-variant="c" data-tone="light">
  <div class="g-container">
    <div class="g-head g-head--center" data-g-reveal="up" data-gsap-fade>{{#if eyebrow}}<p class="g-eyebrow">{{eyebrow}}</p>{{/if}}<h2 class="g-title">{{title}}</h2>{{#if intro}}<p class="g-lead">{{intro}}</p>{{/if}}</div>
    <ul class="g-faq__list g-faq__list--open">{{#each items}}<li class="g-faq__item" data-g-reveal="up" data-g-stagger data-gsap-fade><h3 class="g-faq__q-open">{{question}}</h3><p class="g-faq__a">{{answer}}</p></li>{{/each}}</ul>
  </div>
</section>
