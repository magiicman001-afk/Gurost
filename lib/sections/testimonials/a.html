<section class="g-sec g-testimonials g-testimonials--a" id="testimonials" data-gurost-section="testimonials" data-variant="a" data-tone="light">
  <div class="g-container">
    <div class="g-head g-head--center" data-g-reveal="up" data-gsap-fade>{{#if eyebrow}}<p class="g-eyebrow">{{eyebrow}}</p>{{/if}}<h2 class="g-title">{{title}}</h2>{{#if intro}}<p class="g-lead">{{intro}}</p>{{/if}}</div>
    <ul class="g-quotes__list">{{#each items}}<li class="g-quotes__item" data-g-reveal="up" data-g-stagger data-gsap-slide><figure class="g-quotes__fig"><blockquote class="g-quotes__quote"><p>{{quote}}</p></blockquote><figcaption class="g-quotes__who"><span class="g-quotes__name">{{name}}</span>{{#if role}}<span class="g-quotes__role">{{role}}</span>{{/if}}</figcaption></figure></li>{{/each}}</ul>
  </div>
</section>
