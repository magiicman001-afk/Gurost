<script>
  // Real filtering - genuinely shows/hides the 4 real cards, not a
  // decorative-only filter bar.
  document.querySelectorAll('#filterBar .filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const category = btn.dataset.category;

      document.querySelectorAll('#filterBar .filter-btn').forEach((b) => {
        b.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
        b.classList.add('bg-surface', 'border', 'border-outline-variant', 'text-on-surface-variant');
      });
      btn.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
      btn.classList.remove('bg-surface', 'border', 'border-outline-variant', 'text-on-surface-variant');

      document.querySelectorAll('.template-card').forEach((card) => {
        card.style.display = (category === 'all' || card.dataset.category === category) ? '' : 'none';
      });
    });
  });

  // Real "Use Template" - same real localStorage handoff every
  // building page already reads on its own load, confirmed directly
  // against dashboard.html's own working code before writing this.
  document.querySelectorAll('.use-template-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const prompt = btn.dataset.prompt;
      localStorage.setItem('gurost_pending_generate', JSON.stringify({ mode: 'website', prompt }));
      window.location.href = 'builder.html';
    });
  });
</script>
