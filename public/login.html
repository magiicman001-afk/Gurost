<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  // Real, same Supabase project as signup.html - one real auth system,
  // not a second one. Real, current URL/anon key, not placeholders.
  const GUROST_SUPABASE_URL = "https://jiadrorezquvthyujykb.supabase.co";
  const GUROST_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppYWRyb3JlenF1dnRoeXVqeWtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTI3NzUsImV4cCI6MjA5OTg4ODc3NX0.GWWok3zKSfK3u4Uc3J8MVMhGYiyuZVIi16t6gAppvvs";

  let supabaseClient = null;
  function getSupabaseClient() {
    if (!supabaseClient) supabaseClient = window.supabase.createClient(GUROST_SUPABASE_URL, GUROST_SUPABASE_ANON_KEY);
    return supabaseClient;
  }

  function showError(id, message) {
    const el = document.getElementById(id);
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function hideError(id) {
    document.getElementById(id).classList.add('hidden');
  }

  async function continueWithGoogle() {
    const client = getSupabaseClient();
    await client.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
  }

  // Real check for a returning Google OAuth session - same real logic
  // signup.html already uses, so a Google redirect back to THIS page
  // (login.html) completes correctly, not just on signup.html.
  async function checkForReturningAuthSession() {
    const client = getSupabaseClient();
    const { data } = await client.auth.getSession();
    if (data?.session?.access_token) {
      localStorage.setItem('gurost_jwt', data.session.access_token);
      localStorage.setItem('gurost_user_id', data.session.user.id);
      window.location.href = 'dashboard.html';
    }
  }
  checkForReturningAuthSession();

  document.getElementById('googleBtnLogin').addEventListener('click', continueWithGoogle);

  document.getElementById('togglePasswordBtn').addEventListener('click', () => {
    const input = document.getElementById('li-password');
    const icon = document.getElementById('togglePasswordIcon');
    const nowVisible = input.type === 'password';
    input.type = nowVisible ? 'text' : 'password';
    icon.textContent = nowVisible ? 'visibility' : 'visibility_off';
  });

  // Real login submission - identical real call/flow already proven
  // working in signup.html's own login tab, not a new implementation.
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError('loginError');

    const email = document.getElementById('li-email').value.trim();
    const password = document.getElementById('li-password').value;

    if (!email || !password) {
      return showError('loginError', 'Email and password are both required.');
    }

    const btn = document.getElementById('loginSubmit');
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Logging in…';

    try {
      const result = await GurostAPI.call('/api/auth/login', { method: 'POST', body: { email, password } });
      localStorage.setItem('gurost_jwt', result.token);
      localStorage.setItem('gurost_user_id', result.userId);
      window.location.href = 'dashboard.html';
    } catch (err) {
      showError('loginError', err.message);
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Log In';
    }
  });
</script>
