<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Dashboard - Gurost</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root { --ink: #1A1A2E; --muted: #6B7280; --line: #E9E9EF; --gold: #FEB246; --orange: #FF8C00; }
  body { font-family: 'Inter', sans-serif; background: #FAFAF9; color: var(--ink); }
  .font-display { font-family: 'Montserrat', sans-serif; }
  .gold-gradient { background: linear-gradient(135deg, var(--gold), var(--orange)); }
  .field-input { width: 100%; background: #FAFAF9; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .field-input:focus { outline: none; border-color: var(--orange); }
  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tab-btn { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: white; cursor: pointer; }
  .tab-btn.active { background: var(--orange); color: white; border-color: var(--orange); }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
</style>
</head>
<body class="antialiased">

<!-- Real login screen - shown until a genuine admin token exists -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <h1 class="font-display font-bold text-2xl mb-2 text-center">Admin Access</h1>
    <p class="text-sm text-[var(--muted)] mb-8 text-center">Restricted to Gurost admins and developers.</p>
    <div class="flex flex-col gap-3">
      <input type="text" id="accessCodeInput" placeholder="Access code" class="field-input"/>
      <input type="password" id="passwordInput" placeholder="Password" class="field-input"/>
      <button id="loginBtn" class="gold-gradient text-white font-semibold py-3 rounded-full">Log In</button>
      <p class="hidden text-sm text-red-600 text-center" id="loginError"></p>
    </div>
  </div>
</div>

<!-- Real dashboard - hidden until login succeeds -->
<div id="dashboardScreen" class="hidden">
  <header class="bg-white border-b border-[var(--line)] px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="font-display font-bold text-lg">Gurost Admin</h1>
      <p class="text-xs text-[var(--muted)]" id="welcomeText"></p>
    </div>
    <button id="logoutBtn" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-[var(--line)]">Log Out</button>
  </header>

  <div class="px-6 py-4 flex flex-wrap gap-2 border-b border-[var(--line)] bg-white" id="tabBar"></div>

  <main class="p-6">
    <div id="tabPanels"></div>
  </main>
</div>

<script>
const API_BASE = window.location.origin;
let adminToken = localStorage.getItem('gurost_admin_token');

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` };
}

async function adminCall(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: options.method || 'GET',
    headers: authHeaders(),
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

// Real escaping for user-supplied values (e.g. signup email, which isn't
// format-validated server-side) rendered into innerHTML below — without
// this, a crafted signup email executes in the admin's own session.
const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);
}

// Tabs and the server section each one needs. The server enforces access on every route; this only decides
// which tabs to show.
const TABS = [
  { id: 'overview', label: 'Dashboard', section: 'dashboard' },
  { id: 'inventory', label: 'Software', section: 'inventory' },
  { id: 'models', label: 'Models & APIs', section: 'models' },
  { id: 'projects', label: 'Projects', section: 'projects' },
  { id: 'builds', label: 'Builds log', section: 'builds' },
  { id: 'buildlogs', label: 'Build Logs', section: 'builds' },
  { id: 'memory', label: 'Design memory', section: 'builds' },
  { id: 'team', label: 'Team', section: 'team' },
  { id: 'security', label: 'Security', section: 'security' },
  { id: 'users', label: 'Users', section: 'users' },
  { id: 'usage', label: 'API Usage', section: 'models' },
  { id: 'health', label: 'System Health', section: 'builds' },
  { id: 'payments', label: 'Payments', section: 'revenue' },
  { id: 'bots', label: 'Bot Activity', section: 'bots' },
  { id: 'audit', label: 'Assistant Audit', section: 'security' },
];

function selectTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach((p) => p.classList.toggle('hidden', p.id !== `tab-${id}`));
  loadTab(id);
}

async function showDashboard(name) {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboardScreen').classList.remove('hidden');
  let me;
  try {
    me = await adminCall('/api/admin/me');
  } catch (err) {
    // An expired or revoked session: back to the login screen rather than a dead page.
    localStorage.removeItem('gurost_admin_token');
    adminToken = null;
    document.getElementById('dashboardScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    return;
  }
  document.getElementById('welcomeText').textContent = `Logged in as ${me.name} (${me.role.replace('_', ' ')})`;
  const allowed = TABS.filter((t) => me.sections.includes(t.section));
  const bar = document.getElementById('tabBar');
  const panels = document.getElementById('tabPanels');
  bar.innerHTML = '';
  panels.innerHTML = '';
  allowed.forEach((t) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.tab = t.id;
    btn.textContent = t.label;
    btn.addEventListener('click', () => selectTab(t.id));
    bar.appendChild(btn);
    const panel = document.createElement('div');
    panel.id = `tab-${t.id}`;
    panel.className = 'tab-panel hidden';
    panels.appendChild(panel);
  });
  if (allowed.length) selectTab(allowed[0].id);
  else panels.textContent = 'Your role has no sections yet. Ask the Owner.';
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const accessCode = document.getElementById('accessCodeInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const errorEl = document.getElementById('loginError');
  errorEl.classList.add('hidden');
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessCode, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed.');
    adminToken = data.token;
    localStorage.setItem('gurost_admin_token', adminToken);
    showDashboard();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('hidden');
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('gurost_admin_token');
  adminToken = null;
  document.getElementById('dashboardScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
});

async function loadTab(tab) {
  const el = document.getElementById(`tab-${tab}`);
  el.innerHTML = '<p class="text-sm text-[var(--muted)]">Loading…</p>';
  try {
    if (tab === 'overview') await renderOverview(el);
    else if (tab === 'inventory') await renderInventory(el);
    else if (tab === 'models') await renderModels(el);
    else if (tab === 'builds') await renderBuilds(el);
    else if (tab === 'buildlogs') await renderBuildLogs(el);
    else if (tab === 'team') await renderTeam(el);
    else if (tab === 'security') await renderSecurity(el);
    else if (tab === 'memory') await renderMemory(el);
    else if (tab === 'users') await renderUsers(el);
    else if (tab === 'projects') await renderProjects(el);
    else if (tab === 'usage') await renderUsage(el);
    else if (tab === 'health') await renderHealth(el);
    else if (tab === 'payments') await renderPayments(el);
    else if (tab === 'bots') await renderBots(el);
    else if (tab === 'audit') await renderAudit(el);
  } catch (err) {
    el.innerHTML = `<p class="text-sm text-red-600">${escapeHtml(err.message)}</p>`;
  }
}

async function renderUsers(el) {
  const { users } = await adminCall('/api/admin/users');
  el.innerHTML = `
    <table>
      <thead><tr><th>Email</th><th>Plan</th><th>Status</th><th>Joined</th><th></th></tr></thead>
      <tbody>${users.map((u) => `
        <tr>
          <td>${escapeHtml(u.email || '—')}</td>
          <td>${u.plan}</td>
          <td><span class="badge" style="background:${u.status === 'blocked' ? '#fee2e2' : '#dcfce7'};color:${u.status === 'blocked' ? '#991b1b' : '#166534'};">${u.status || 'active'}${u.status === 'blocked' && u.blocked_reason ? ' — ' + u.blocked_reason : ''}</span></td>
          <td>${new Date(u.created_at).toLocaleDateString()}</td>
          <td><button class="text-xs font-semibold underline" data-user="${u.user_id}" data-action="${u.status === 'blocked' ? 'unblock' : 'block'}">${u.status === 'blocked' ? 'Unblock' : 'Block'}</button></td>
        </tr>`).join('')}</tbody>
    </table>`;
  el.querySelectorAll('[data-action]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const userId = btn.dataset.user;
      const action = btn.dataset.action;
      try {
        if (action === 'block') {
          const reason = prompt('Reason for blocking this user?') || 'No reason given.';
          await adminCall(`/api/admin/users/${userId}/block`, { method: 'POST', body: { reason } });
        } else {
          await adminCall(`/api/admin/users/${userId}/unblock`, { method: 'POST' });
        }
        renderUsers(el);
      } catch (err) { alert(err.message); }
    });
  });
}

async function renderProjects(el) {
  const { projects } = await adminCall('/api/admin/projects/saved');
  el.innerHTML = `
    <p class="text-xs text-[var(--muted)] mb-3">Saved projects (newest first, up to 200). "Live" means the project is also in the server's memory right now.</p>
    <table>
      <thead><tr><th>Name</th><th>Type</th><th>State</th><th>Updated</th><th>Live</th></tr></thead>
      <tbody>${projects.map((p) => `
        <tr><td>${escapeHtml(p.name || p.id)}</td><td>${escapeHtml(p.type || '—')}</td><td>${escapeHtml(p.state || '—')}</td><td>${p.updatedAt ? new Date(p.updatedAt).toLocaleString() : '—'}</td><td>${p.inMemory ? 'yes' : ''}</td></tr>`).join('')}</tbody>
    </table>`;
}

function card(label, c) {
  const v = c && c.value !== null && c.value !== undefined ? escapeHtml(String(c.value)) : '—';
  const note = c && c.note ? `<p class="text-xs text-[var(--muted)] mt-1">${escapeHtml(c.note)}</p>` : '';
  return `<div class="border border-[var(--line)] rounded-xl bg-white p-4"><p class="text-xs text-[var(--muted)]">${escapeHtml(label)}</p><p class="font-display font-bold text-2xl">${v}</p>${note}</div>`;
}

async function renderOverview(el) {
  const { cards } = await adminCall('/api/admin/dashboard');
  const labels = { buildsWeek: 'Builds this week', failedWeek: 'Failed builds this week', activeUsers: 'Active builders', errorsHour: 'Server errors, last hour', spend: 'AI spend this week ($)', revenue: 'Revenue' };
  el.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-3 gap-3">${Object.keys(labels).filter((k) => cards[k]).map((k) => card(labels[k], cards[k])).join('')}</div>`;
}

async function renderInventory(el) {
  const d = await adminCall('/api/admin/inventory');
  el.innerHTML = `
    <p class="text-sm mb-3">Version <b>${escapeHtml(d.version)}</b> · running since ${new Date(d.lastDeploy).toLocaleString()}</p>
    <table>
      <thead><tr><th>Product</th><th>Status</th><th>Owner</th><th>Switches</th><th>Note</th></tr></thead>
      <tbody>${d.products.map((p) => `
        <tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.status)}</td><td>${escapeHtml(p.owner)}</td><td>${p.flags.map((f) => `${escapeHtml(f.name)}: ${f.on ? 'ON' : 'off'}`).join('<br>') || '—'}</td><td>${escapeHtml(p.note || '')}</td></tr>`).join('')}</tbody>
    </table>
    <p class="text-xs text-[var(--muted)] mt-3">${escapeHtml(d.note)}</p>`;
}

async function renderModels(el) {
  const d = await adminCall('/api/admin/models');
  el.innerHTML = `
    <table>
      <thead><tr><th>Provider</th><th>Key</th><th>Balance</th></tr></thead>
      <tbody>${d.providers.map((p) => `<tr><td>${escapeHtml(p.name)}</td><td>${p.configured ? 'set' : '<b>not set</b>'}</td><td>${escapeHtml(p.balance)}</td></tr>`).join('')}</tbody>
    </table>
    <p class="text-xs text-[var(--muted)] mt-3">Key values are never shown. ${escapeHtml(d.note)}</p>`;
}

async function renderBuilds(el) {
  const d = await adminCall('/api/admin/builds');
  el.innerHTML = `
    <p class="text-sm mb-3">This week: <b>${d.week.total}</b> builds, <b>${d.week.failed}</b> failed.</p>
    <table>
      <thead><tr><th>When</th><th>Result</th><th>Designs</th><th>Best score</th><th>Seconds</th><th>Why it failed</th></tr></thead>
      <tbody>${d.builds.map((b) => `
        <tr><td>${new Date(b.created_at).toLocaleString()}</td><td>${escapeHtml(b.status)}</td><td>${b.designs ?? '—'}</td><td>${b.best_score ?? '—'}</td><td>${b.seconds ?? '—'}</td><td>${escapeHtml(b.error || '')}</td></tr>`).join('')}</tbody>
    </table>
    <p class="text-xs text-[var(--muted)] mt-3">${escapeHtml(d.note)}</p>`;
}

const BL_COLOURS = { success: '#15803d', fail: '#c2410c', escalate: '#1d4ed8' };
async function renderBuildLogs(el) {
  el.innerHTML = `
    <div class="flex flex-wrap gap-2 mb-3 text-sm">
      <input id="blProject" class="border border-[var(--line)] rounded px-2 py-1" placeholder="Project id">
      <input id="blUser" class="border border-[var(--line)] rounded px-2 py-1" placeholder="User id">
      <select id="blBot" class="border border-[var(--line)] rounded px-2 py-1"><option value="">All bots</option>${['builder','fixer','manager','senior','copywriter','photographer','reviewer'].map((b) => `<option>${b}</option>`).join('')}</select>
      <select id="blResult" class="border border-[var(--line)] rounded px-2 py-1"><option value="">All results</option><option>success</option><option>fail</option><option>escalate</option></select>
      <button id="blGo" class="tab-btn">Search</button>
      <button id="blExport" class="tab-btn">Export JSON</button>
    </div>
    <p id="blNote" class="text-xs text-[var(--muted)] mb-2"></p>
    <div id="blList"></div>`;
  let last = null;
  async function load() {
    const q = new URLSearchParams();
    [['projectId', 'blProject'], ['userId', 'blUser'], ['bot', 'blBot'], ['result', 'blResult']].forEach(([k, id]) => { const v = document.getElementById(id).value.trim(); if (v) q.set(k, v); });
    const out = document.getElementById('blList');
    out.textContent = 'Loading…';
    try {
      last = await adminCall(`/api/admin/build-logs?${q}`);
    } catch (err) { out.textContent = err.message; return; }
    document.getElementById('blNote').textContent = `${last.builds.length} builds shown (${last.rows} actions). Orange-flagged builds need a person.`;
    out.innerHTML = last.builds.map((b) => `
      <details class="border border-[var(--line)] rounded-xl bg-white p-3 mb-2" ${b.flagged ? 'open' : ''}>
        <summary class="cursor-pointer text-sm"><b>${new Date(b.startedAt).toLocaleString()}</b> · project ${escapeHtml(String(b.projectId || '—').slice(0, 8))} · user ${escapeHtml(String(b.userId || '—').slice(0, 8))} · ${b.entries.length} actions · bots: ${escapeHtml(b.bots.join(' > '))}${b.escalated ? ' · <span style="color:#1d4ed8">escalated</span>' : ''}${b.flagged ? ' · <b style="color:#c2410c">FLAGGED</b>' : ''}</summary>
        <table class="mt-2"><thead><tr><th>Bot</th><th>Result</th><th>Task</th><th>Decision</th><th>Why</th><th>ms</th><th>Next</th></tr></thead>
        <tbody>${b.entries.map((e) => `<tr><td>${escapeHtml(e.bot)}</td><td style="color:${BL_COLOURS[e.result] || '#000'};font-weight:600">${escapeHtml(e.result)}</td><td>${escapeHtml(e.task || '')}</td><td>${escapeHtml(e.decision || '')}</td><td>${escapeHtml(e.reason || '')}${e.details && e.details.report ? `<pre class="text-xs whitespace-pre-wrap mt-1">${escapeHtml(e.details.report)}</pre>` : ''}</td><td>${e.time_ms ?? ''}</td><td>${escapeHtml(e.next_bot || '')}</td></tr>`).join('')}</tbody></table>
      </details>`).join('') || '<p class="text-sm text-[var(--muted)]">No build logs yet. They appear from the next library build.</p>';
  }
  document.getElementById('blGo').addEventListener('click', load);
  document.getElementById('blExport').addEventListener('click', () => {
    if (!last) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(last, null, 2)], { type: 'application/json' }));
    a.download = 'gurost-build-logs.json';
    a.click();
  });
  await load();
}

const RANK = { viewer: 0, engineer: 1, team_lead: 2, admin: 3, owner: 4 };
async function renderTeam(el) {
  const d = await adminCall('/api/admin/team');
  const me = d.members.find((m) => m.id === d.you);
  const myRank = me ? RANK[me.role] : -1;
  el.innerHTML = `
    <p class="text-xs text-[var(--muted)] mb-3">You can create and manage roles below your own. Credentials are shown once and stored only as hashes. (Email + key login arrives with the security session work.)</p>
    <div id="teamSecret"></div>
    <table class="mb-5">
      <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead>
      <tbody>${d.members.map((m) => {
        const manage = m.id !== d.you && RANK[m.role] < myRank;
        return `<tr><td>${escapeHtml(m.name)}${m.id === d.you ? ' (you)' : ''}</td><td>${escapeHtml(m.role.replace('_', ' '))}</td><td>${m.active ? 'active' : '<b>revoked</b>'}</td><td>${m.last_login_at ? new Date(m.last_login_at).toLocaleString() : 'never'}</td><td>${manage ? `
          <select data-role-of="${escapeHtml(m.id)}">${d.assignable.map((r) => `<option ${r === m.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
          <button class="tab-btn" data-act="role" data-id="${escapeHtml(m.id)}">Set role</button>
          <button class="tab-btn" data-act="${m.active ? 'revoke' : 'restore'}" data-id="${escapeHtml(m.id)}">${m.active ? 'Revoke' : 'Restore'}</button>
          <button class="tab-btn" data-act="regen" data-id="${escapeHtml(m.id)}">New credentials</button>` : ''}</td></tr>`;
      }).join('')}</tbody>
    </table>
    ${d.assignable.length ? `<div class="flex flex-wrap gap-2 text-sm">
      <input id="tmName" class="border border-[var(--line)] rounded px-2 py-1" placeholder="Name">
      <select id="tmRole" class="border border-[var(--line)] rounded px-2 py-1">${d.assignable.map((r) => `<option>${r}</option>`).join('')}</select>
      <button id="tmCreate" class="tab-btn">Add team member</button></div>` : ''}`;
  const showSecret = (r) => {
    document.getElementById('teamSecret').innerHTML = `<div class="border-2 border-[var(--orange)] rounded-xl bg-white p-4 mb-4"><b>${escapeHtml(r.name)}</b>: save these now. They will not be shown again.<br>Access code: <code>${escapeHtml(r.accessCode)}</code><br>Password: <code>${escapeHtml(r.password)}</code></div>`;
  };
  const reasonFor = (what) => { const r = prompt(`Reason for: ${what}?`); return r && r.trim().length >= 3 ? r.trim() : null; };
  const run = async (fn) => { try { await fn(); await renderTeam(el); } catch (err) { alert(err.message); } };
  el.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.id; const act = b.dataset.act;
    if (act === 'role') {
      const role = el.querySelector(`[data-role-of="${id}"]`).value; const reason = reasonFor(`change role to ${role}`);
      if (reason) run(() => adminCall(`/api/admin/team/${id}/role`, { method: 'POST', body: { role, reason } }));
    } else if (act === 'revoke' || act === 'restore') {
      const reason = reasonFor(act === 'revoke' ? 'revoke access' : 'restore access');
      if (reason && confirm(act === 'revoke' ? 'Revoke this person now?' : 'Restore this person?')) run(() => adminCall(`/api/admin/team/${id}/active`, { method: 'POST', body: { active: act === 'restore', reason } }));
    } else if (act === 'regen') {
      const reason = reasonFor('issue new credentials (the old ones stop working)');
      if (reason && confirm('The old access code and password stop working at once. Continue?')) run(async () => { showSecret(await adminCall(`/api/admin/team/${id}/regenerate`, { method: 'POST', body: { reason } })); });
    }
  }));
  const create = document.getElementById('tmCreate');
  if (create) create.addEventListener('click', async () => {
    const name = document.getElementById('tmName').value.trim(); const role = document.getElementById('tmRole').value;
    const reason = reasonFor(`add ${name || 'a member'} as ${role}`);
    if (!name || !reason) return;
    try { const r = await adminCall('/api/admin/team', { method: 'POST', body: { name, role, reason } }); await renderTeam(el); showSecret(r); } catch (err) { alert(err.message); }
  });
}

async function renderSecurity(el) {
  const d = await adminCall('/api/admin/security');
  el.innerHTML = `
    <table class="mb-5"><thead><tr><th>Protection</th><th>State</th></tr></thead>
      <tbody>${d.layers.map((l) => `<tr><td>${escapeHtml(l.name)}</td><td>${escapeHtml(l.state)}</td></tr>`).join('')}</tbody></table>
    <p class="text-sm mb-2">Admin accounts: <b>${d.accounts.active}</b> active, <b>${d.accounts.revoked}</b> revoked (${Object.entries(d.accounts.byRole).map(([r, n]) => `${escapeHtml(r)}: ${n}`).join(', ') || 'none'}).${d.neverLoggedIn.length ? ` Never logged in: ${d.neverLoggedIn.map(escapeHtml).join(', ')}.` : ''}</p>
    <h3 class="font-display font-bold mt-4 mb-2">Recent admin actions</h3>
    <table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Reason</th></tr></thead>
      <tbody>${d.audit.map((a) => `<tr><td>${new Date(a.created_at).toLocaleString()}</td><td>${escapeHtml(a.admin_name || '')} (${escapeHtml(a.role || '')})</td><td>${escapeHtml(a.action)}</td><td>${escapeHtml(a.reason || '')}</td></tr>`).join('') || '<tr><td colspan="4">Nothing recorded yet.</td></tr>'}</tbody></table>`;
}

// Business Assistant audit trail: newest first, with filters. Every value is
// put on the page as text (never HTML). The JSON route is the source of truth.
async function renderAudit(el) {
  el.textContent = '';
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const bar = mk('div', 'flex flex-wrap gap-2 mb-3');
  const event = mk('select', 'field-input'); event.style.width = 'auto';
  [['', 'All events'], ['chat', 'Chat'], ['tool_call', 'Tool calls'], ['approval', 'Approvals'], ['memory', 'Memory'], ['error', 'Errors']].forEach(([v, t]) => { const o = mk('option', null, t); o.value = v; event.appendChild(o); });
  const bot = mk('select', 'field-input'); bot.style.width = 'auto';
  [['', 'All bots'], ['sales', 'Sales'], ['hr', 'HR'], ['finance', 'Finance'], ['payroll', 'Payroll'], ['support', 'Support'], ['custom', 'Custom']].forEach(([v, t]) => { const o = mk('option', null, t); o.value = v; bot.appendChild(o); });
  const user = mk('input', 'field-input'); user.style.width = '220px'; user.placeholder = 'User id (optional)';
  const go = mk('button', 'tab-btn active', 'Show');
  bar.append(event, bot, user, go);
  const note = mk('p', 'text-xs text-[var(--muted)] mb-3', 'What the assistant did, newest first. Message text, email bodies and secrets are never stored here.');
  const msg = mk('p', 'text-sm text-red-600 mb-2');
  const wrap = mk('div', 'overflow-x-auto');
  const table = mk('table');
  const head = mk('thead'); const hr = mk('tr');
  ['When', 'User', 'Bot', 'Event', 'Tool', 'OK', 'Asked for', 'Answered by', 'Approved', 'Input', 'Result', 'IP'].forEach((h) => hr.appendChild(mk('th', null, h)));
  head.appendChild(hr); table.appendChild(head);
  const body = mk('tbody'); table.appendChild(body); wrap.appendChild(table);
  const more = mk('button', 'tab-btn', 'Load older'); more.hidden = true; more.style.marginTop = '12px';
  el.append(bar, note, msg, wrap, more);

  let oldest = null;
  async function load(append) {
    msg.textContent = '';
    const q = new URLSearchParams({ limit: '50' });
    if (event.value) q.set('event', event.value);
    if (bot.value) q.set('bot', bot.value);
    if (user.value.trim()) q.set('user', user.value.trim());
    if (append && oldest) q.set('before', oldest);
    try {
      const { entries } = await adminCall('/api/admin/audit?' + q.toString());
      if (!append) { body.textContent = ''; }
      entries.forEach((r) => {
        const tr = mk('tr');
        [new Date(r.created_at).toLocaleString(), (r.user_id || '').slice(0, 8) + '…', r.bot_type || '-', r.event, r.tool_used || '-', r.ok === null ? '-' : r.ok ? 'yes' : 'no',
          r.model_requested || '-', r.model_used || '-', r.approved_by_user === null ? '-' : r.approved_by_user ? 'approved' : 'cancelled', r.input || '-', r.output || '-', r.ip_address || '-']
          .forEach((v) => tr.appendChild(mk('td', null, v)));
        body.appendChild(tr);
      });
      if (entries.length) oldest = entries[entries.length - 1].created_at;
      more.hidden = entries.length < 50;
      if (!append && !entries.length) msg.textContent = 'Nothing recorded yet for this filter.';
    } catch (err) { msg.textContent = err.message; }
  }
  go.addEventListener('click', () => { oldest = null; load(false); });
  more.addEventListener('click', () => load(true));
  await load(false);
}

document.addEventListener('DOMContentLoaded', () => {
  if (adminToken) showDashboard();
