<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Admin Dashboard - Gurost</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root { --ink: #1A1A2E; --muted: #6B7280; --line: #E9E9EF; --gold: #FEB246; --orange: #FF8C00; }
  body { font-family: 'Inter', sans-serif; background: #FAFAF9; color: var(--ink); }
  .font-display { font-family: 'Montserrat', sans-serif; }
  .gold-gradient { background: linear-gradient(135deg, var(--gold), var(--orange)); }
  .field-input { width: 100%; background: #FAFAF9; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .field-input:focus { outline: none; border-color: var(--orange); }
  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  th { text-align: left; padding: 8px 10px; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .tab-btn { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: white; cursor: pointer; }
  .tab-btn.active { background: var(--orange); color: white; border-color: var(--orange); }
  /* Phone: tables scroll inside their panel instead of widening the page, and the 18 tabs sit on one swipeable row. */
  .tab-panel { overflow-x: auto; }
  @media (max-width: 640px) { #tabBar { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; } .tab-btn { white-space: nowrap; flex: none; } main { padding: 16px; } }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
</style>
<link href="shared/bot-widgets.css" rel="stylesheet"/>
</head>
<body class="antialiased">

<!-- Real login screen - shown until a genuine admin token exists -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-6">
  <div class="w-full max-w-sm">
    <h1 class="font-display font-bold text-2xl mb-2 text-center">Admin Access</h1>
    <p class="text-sm text-[var(--muted)] mb-8 text-center">Restricted to Gurost admins and developers.</p>
    <div class="flex flex-col gap-3">
      <input type="text" id="accessCodeInput" placeholder="Access code" class="field-input"/>
      <input type="password" id="passwordInput" placeholder="Password" class="field-input"/>
      <button id="loginBtn" class="gold-gradient text-white font-semibold py-3 rounded-full">Log In</button>
      <p class="hidden text-sm text-red-600 text-center" id="loginError"></p>
    </div>
  </div>
</div>

<!-- Real dashboard - hidden until login succeeds -->
<div id="dashboardScreen" class="hidden">
  <header class="bg-white border-b border-[var(--line)] px-6 py-4 flex items-center justify-between">
    <div>
      <h1 class="font-display font-bold text-lg">Gurost Admin</h1>
      <p class="text-xs text-[var(--muted)]" id="welcomeText"></p>
    </div>
    <button id="logoutBtn" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-[var(--line)]">Log Out</button>
  </header>

  <div class="px-6 py-4 flex flex-wrap gap-2 border-b border-[var(--line)] bg-white" id="tabBar"></div>

  <main class="p-6">
    <div id="panelHead" class="flex items-center justify-between mb-3">
      <h2 id="panelTitle" class="font-display font-bold text-base"></h2>
      <button id="helpBtn" type="button" aria-label="Help for this tab" title="Help for this tab" class="tab-btn" style="width:34px;height:34px;padding:0;border-radius:50%;font-weight:800">?</button>
    </div>
    <div id="tabPanels"></div>
  </main>
</div>

<script src="/shared/admin-guide-ui.js"></script>
<script>
const API_BASE = window.location.origin;
let adminToken = localStorage.getItem('gurost_admin_token');

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` };
}

async function adminCall(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: options.method || 'GET',
    headers: authHeaders(),
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed.');
  return data;
}

// Real escaping for user-supplied values (e.g. signup email, which isn't
// format-validated server-side) rendered into innerHTML below — without
// this, a crafted signup email executes in the admin's own session.
const HTML_ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => HTML_ESCAPES[c]);
}

// Tabs and the server section each one needs. The server enforces access on every route; this only decides
// which tabs to show.
const TABS = [
  { id: 'overview', label: 'Dashboard', section: 'dashboard' },
  { id: 'inventory', label: 'Software', section: 'inventory' },
  { id: 'models', label: 'Models & APIs', section: 'models' },
  { id: 'projects', label: 'Projects', section: 'projects' },
  { id: 'builds', label: 'Builds log', section: 'builds' },
  { id: 'buildlogs', label: 'Build Logs', section: 'builds' },
  { id: 'memory', label: 'Design memory', section: 'builds' },
  { id: 'code', label: 'Code & deploy', section: 'code' },
  { id: 'docs', label: 'Docs', section: 'docs' },
  { id: 'ops', label: 'Ops', section: 'ops' },
  { id: 'team', label: 'Team', section: 'team' },
  { id: 'security', label: 'Security', section: 'security' },
  { id: 'users', label: 'Users', section: 'users' },
  { id: 'usage', label: 'API Usage', section: 'models' },
  { id: 'health', label: 'System Health', section: 'builds' },
  { id: 'payments', label: 'Payments', section: 'revenue' },
  { id: 'bots', label: 'Bot Activity', section: 'bots' },
  { id: 'audit', label: 'Assistant Audit', section: 'security' },
  { id: 'proactive', label: 'Proactive Log', section: 'bots' },
  { id: 'tools', label: 'Connected Tools', section: 'bots' },
  { id: 'guide', label: 'Guide', section: null }, // every role: the section is null, so it is always shown
];

function selectTab(id) {
  document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach((p) => p.classList.toggle('hidden', p.id !== `tab-${id}`));
  const tabInfo = TABS.find((t) => t.id === id);
  document.getElementById('panelTitle').textContent = tabInfo ? tabInfo.label : '';
  document.getElementById('helpBtn').dataset.tab = id;
  loadTab(id);
}

async function showDashboard(name) {
  // The assistant team appears only after the admin has signed in, never on the login screen.
  if (!window.GurostBotWidgets && !document.getElementById('botWidgetsScript')) {
    const bw = document.createElement('script'); bw.id = 'botWidgetsScript'; bw.src = 'shared/bot-widgets.js'; document.body.appendChild(bw);
  }
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboardScreen').classList.remove('hidden');
  let me;
  try {
    me = await adminCall('/api/admin/me');
  } catch (err) {
    // An expired or revoked session: back to the login screen rather than a dead page.
    localStorage.removeItem('gurost_admin_token');
    adminToken = null;
    document.getElementById('dashboardScreen').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    return;
  }
  document.getElementById('welcomeText').textContent = `Logged in as ${me.name} (${me.role.replace('_', ' ')})`;
  const allowed = TABS.filter((t) => t.section === null || me.sections.includes(t.section));
  const bar = document.getElementById('tabBar');
  const panels = document.getElementById('tabPanels');
  bar.innerHTML = '';
  panels.innerHTML = '';
  allowed.forEach((t) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.tab = t.id;
    btn.textContent = t.label;
    btn.addEventListener('click', () => selectTab(t.id));
    bar.appendChild(btn);
    const panel = document.createElement('div');
    panel.id = `tab-${t.id}`;
    panel.className = 'tab-panel hidden';
    panels.appendChild(panel);
  });
  if (allowed.length) selectTab(allowed[0].id);
  else panels.textContent = 'Your role has no sections yet. Ask the Owner.';
  // Help and Guide: the ? button, the Guide tab, and the first-login tour (docs/ADMIN_GUIDE_SPEC.md).
  AdminGuide.init({ call: adminCall, name: me.name, role: me.role, gotoTab: selectTab });
}

document.getElementById('helpBtn').addEventListener('click', (ev) => {
  const id = ev.currentTarget.dataset.tab;
  const info = TABS.find((t) => t.id === id);
  if (id === 'guide') { AdminGuide.startTour(); return; }
  AdminGuide.openHelp(id, info ? info.label : id);
});

document.getElementById('loginBtn').addEventListener('click', async () => {
  const accessCode = document.getElementById('accessCodeInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const errorEl = document.getElementById('loginError');
  errorEl.classList.add('hidden');
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accessCode, password }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login failed.');
    adminToken = data.token;
    localStorage.setItem('gurost_admin_token', adminToken);
    showDashboard();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.classList.remove('hidden');
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('gurost_admin_token');
  adminToken = null;
  document.getElementById('dashboardScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
});

async function loadTab(tab) {
  const el = document.getElementById(`tab-${tab}`);
  el.innerHTML = '<p class="text-sm text-[var(--muted)]">Loading…</p>';
  try {
    if (tab === 'overview') await renderOverview(el);
    else if (tab === 'inventory') await renderInventory(el);
    else if (tab === 'models') await renderModels(el);
    else if (tab === 'builds') await renderBuilds(el);
    else if (tab === 'buildlogs') await renderBuildLogs(el);
    else if (tab === 'code') await renderCode(el);
    else if (tab === 'docs') await renderDocs(el);
    else if (tab === 'ops') await renderOps(el);
    else if (tab === 'team') await renderTeam(el);
    else if (tab === 'security') await renderSecurity(el);
    else if (tab === 'memory') await renderMemory(el);
    else if (tab === 'users') await renderUsers(el);
    else if (tab === 'projects') await renderProjects(el);
    else if (tab === 'usage') await renderUsage(el);
    else if (tab === 'health') await renderHealth(el);
    else if (tab === 'payments') await renderPayments(el);
    else if (tab === 'bots') await renderBots(el);
    else if (tab === 'audit') await renderAudit(el);
    else if (tab === 'proactive') await renderProactive(el);
    else if (tab === 'tools') await renderTools(el);
    else if (tab === 'guide') await AdminGuide.renderGuide(el);
  } catch (err) {
    el.innerHTML = `<p class="text-sm text-red-600">${escapeHtml(err.message)}</p>`;
  }
}

async function renderUsers(el) {
  const { users } = await adminCall('/api/admin/users');
  const list = users || [];
  if (!list.length) { el.innerHTML = empty('No users yet.'); return; }
  const blocked = list.filter((u) => u.status === 'blocked').length;
  const paid = list.filter((u) => u.plan && u.plan !== 'free').length;
  const weekAgo = Date.now() - 7 * 86400000;
  const fresh = list.filter((u) => Date.parse(u.created_at) >= weekAgo).length;
  el.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      ${tile('Users', num(list.length))}${tile('Joined this week', num(fresh))}${tile('On a paid plan', num(paid))}${tile('Blocked', num(blocked), null, blocked ? '#c2410c' : '')}
    </div>
    <div class="overflow-x-auto"><table>
      <thead><tr><th>Email</th><th>Plan</th><th>Status</th><th>Joined</th><th></th></tr></thead>
      <tbody>${list.map((u) => `
        <tr>
          <td style="word-break:break-word">${escapeHtml(u.email || '—')}</td>
          <td>${pill(u.plan || 'free', u.plan && u.plan !== 'free' ? '#dbeafe' : '#f1f5f9', u.plan && u.plan !== 'free' ? '#1d4ed8' : '#475569')}</td>
          <td>${u.status === 'blocked' ? pill('blocked' + (u.blocked_reason ? ' — ' + u.blocked_reason : ''), '#fee2e2', '#991b1b') : pill(u.status || 'active', '#dcfce7', '#166534')}</td>
          <td style="white-space:nowrap">${escapeHtml(new Date(u.created_at).toLocaleDateString())}</td>
          <td><button class="text-xs font-semibold underline" data-user="${escapeHtml(u.user_id)}" data-action="${u.status === 'blocked' ? 'unblock' : 'block'}">${u.status === 'blocked' ? 'Unblock' : 'Block'}</button></td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  el.querySelectorAll('[data-action]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const userId = btn.dataset.user;
      const action = btn.dataset.action;
      try {
        if (action === 'block') {
          const reason = prompt('Reason for blocking this user?') || 'No reason given.';
          await adminCall(`/api/admin/users/${userId}/block`, { method: 'POST', body: { reason } });
        } else {
          await adminCall(`/api/admin/users/${userId}/unblock`, { method: 'POST' });
        }
        renderUsers(el);
      } catch (err) { alert(err.message); }
    });
  });
}

async function renderProjects(el) {
  const { projects } = await adminCall('/api/admin/projects/saved');
  el.innerHTML = `
    <p class="text-xs text-[var(--muted)] mb-3">Saved projects (newest first, up to 200). "Live" means the project is also in the server's memory right now.</p>
    <table>
      <thead><tr><th>Name</th><th>Type</th><th>State</th><th>Updated</th><th>Live</th></tr></thead>
      <tbody>${projects.map((p) => `
        <tr><td>${escapeHtml(p.name || p.id)}</td><td>${escapeHtml(p.type || '—')}</td><td>${escapeHtml(p.state || '—')}</td><td>${p.updatedAt ? new Date(p.updatedAt).toLocaleString() : '—'}</td><td>${p.inMemory ? 'yes' : ''}</td></tr>`).join('')}</tbody>
    </table>`;
}

function card(label, c) {
  const cardValue = c && c.value !== null && c.value !== undefined ? escapeHtml(String(c.value)) : '—';
  const cardNote = c && c.note ? `<p class="text-xs text-[var(--muted)] mt-1">${escapeHtml(c.note)}</p>` : '';
  return `<div class="border border-[var(--line)] rounded-xl bg-white p-4"><p class="text-xs text-[var(--muted)]">${escapeHtml(label)}</p><p class="font-display font-bold text-2xl">${cardValue}</p>${cardNote}</div>`;
}

async function renderOverview(el) {
  const { cards } = await adminCall('/api/admin/dashboard');
  const labels = { buildsWeek: 'Builds this week', failedWeek: 'Failed builds this week', activeUsers: 'Active builders', errorsHour: 'Server errors, last hour', spend: 'AI spend this week ($)', revenue: 'Revenue' };
  el.innerHTML = `<div class="grid grid-cols-2 md:grid-cols-3 gap-3">${Object.keys(labels).filter((k) => cards[k]).map((k) => card(labels[k], cards[k])).join('')}</div>`;
}

async function renderInventory(el) {
  const d = await adminCall('/api/admin/inventory');
  el.innerHTML = `
    <p class="text-sm mb-3">Version <b>${escapeHtml(d.version)}</b> · running since ${new Date(d.lastDeploy).toLocaleString()}</p>
    <table>
      <thead><tr><th>Product</th><th>Status</th><th>Owner</th><th>Switches</th><th>Note</th></tr></thead>
      <tbody>${d.products.map((p) => `
        <tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml(p.status)}</td><td>${escapeHtml(p.owner)}</td><td>${p.flags.map((f) => `${escapeHtml(f.name)}: ${f.on ? 'ON' : 'off'}`).join('<br>') || '—'}</td><td>${escapeHtml(p.note || '')}</td></tr>`).join('')}</tbody>
    </table>
    <p class="text-xs text-[var(--muted)] mt-3">${escapeHtml(d.note)}</p>`;
}

async function renderModels(el) {
  const d = await adminCall('/api/admin/models');
  el.innerHTML = `
    <table>
      <thead><tr><th>Provider</th><th>Key</th><th>Balance</th></tr></thead>
      <tbody>${d.providers.map((p) => `<tr><td>${escapeHtml(p.name)}</td><td>${p.configured ? 'set' : '<b>not set</b>'}</td><td>${escapeHtml(p.balance)}</td></tr>`).join('')}</tbody>
    </table>
    <p class="text-xs text-[var(--muted)] mt-3">Key values are never shown. ${escapeHtml(d.note)}</p>`;
}

async function renderBuilds(el) {
  const d = await adminCall('/api/admin/builds');
  el.innerHTML = `
    <p class="text-sm mb-3">This week: <b>${d.week.total}</b> builds, <b>${d.week.failed}</b> failed.</p>
    <table>
      <thead><tr><th>When</th><th>Result</th><th>Designs</th><th>Best score</th><th>Seconds</th><th>Why it failed</th></tr></thead>
      <tbody>${d.builds.map((b) => `
        <tr><td>${new Date(b.created_at).toLocaleString()}</td><td>${escapeHtml(b.status)}</td><td>${b.designs ?? '—'}</td><td>${b.best_score ?? '—'}</td><td>${b.seconds ?? '—'}</td><td>${escapeHtml(b.error || '')}</td></tr>`).join('')}</tbody>
    </table>
    <p class="text-xs text-[var(--muted)] mt-3">${escapeHtml(d.note)}</p>`;
}

const BL_COLOURS = { success: '#15803d', fail: '#c2410c', escalate: '#1d4ed8' };
async function renderBuildLogs(el) {
  el.innerHTML = `
    <div class="flex flex-wrap gap-2 mb-3 text-sm">
      <input id="blProject" class="border border-[var(--line)] rounded px-2 py-1" placeholder="Project id">
      <input id="blUser" class="border border-[var(--line)] rounded px-2 py-1" placeholder="User id">
      <select id="blBot" class="border border-[var(--line)] rounded px-2 py-1"><option value="">All bots</option>${['builder','fixer','manager','senior','copywriter','photographer','reviewer'].map((b) => `<option>${escapeHtml(b)}</option>`).join('')}</select>
      <select id="blResult" class="border border-[var(--line)] rounded px-2 py-1"><option value="">All results</option><option>success</option><option>fail</option><option>escalate</option></select>
      <button id="blGo" class="tab-btn">Search</button>
      <button id="blExport" class="tab-btn">Export JSON</button>
    </div>
    <p id="blNote" class="text-xs text-[var(--muted)] mb-2"></p>
    <div id="blList"></div>`;
  let last = null;
  async function load() {
    const q = new URLSearchParams();
    [['projectId', 'blProject'], ['userId', 'blUser'], ['bot', 'blBot'], ['result', 'blResult']].forEach(([k, id]) => { const v = document.getElementById(id).value.trim(); if (v) q.set(k, v); });
    const out = document.getElementById('blList');
    out.textContent = 'Loading…';
    try {
      last = await adminCall(`/api/admin/build-logs?${q}`);
    } catch (err) { out.textContent = err.message; return; }
    document.getElementById('blNote').textContent = `${last.builds.length} builds shown (${last.rows} actions). Orange-flagged builds need a person.`;
    out.innerHTML = last.builds.map((b) => `
      <details class="border border-[var(--line)] rounded-xl bg-white p-3 mb-2" ${b.flagged ? 'open' : ''}>
        <summary class="cursor-pointer text-sm"><b>${new Date(b.startedAt).toLocaleString()}</b> · project ${escapeHtml(String(b.projectId || '—').slice(0, 8))} · user ${escapeHtml(String(b.userId || '—').slice(0, 8))} · ${b.entries.length} actions · bots: ${escapeHtml(b.bots.join(' > '))}${b.escalated ? ' · <span style="color:#1d4ed8">escalated</span>' : ''}${b.flagged ? ' · <b style="color:#c2410c">FLAGGED</b>' : ''}</summary>
        <table class="mt-2"><thead><tr><th>Bot</th><th>Result</th><th>Task</th><th>Decision</th><th>Why</th><th>ms</th><th>Next</th></tr></thead>
        <tbody>${b.entries.map((e) => `<tr><td>${escapeHtml(e.bot)}</td><td style="color:${escapeHtml(BL_COLOURS[e.result] || '#000')};font-weight:600">${escapeHtml(e.result)}</td><td>${escapeHtml(e.task || '')}</td><td>${escapeHtml(e.decision || '')}</td><td>${escapeHtml(e.reason || '')}${e.details && e.details.report ? `<pre class="text-xs whitespace-pre-wrap mt-1">${escapeHtml(e.details.report)}</pre>` : ''}</td><td>${e.time_ms ?? ''}</td><td>${escapeHtml(e.next_bot || '')}</td></tr>`).join('')}</tbody></table>
      </details>`).join('') || '<p class="text-sm text-[var(--muted)]">No build logs yet. They appear from the next library build.</p>';
  }
  document.getElementById('blGo').addEventListener('click', load);
  document.getElementById('blExport').addEventListener('click', () => {
    if (!last) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(last, null, 2)], { type: 'application/json' }));
    a.download = 'gurost-build-logs.json';
    a.click();
  });
  await load();
}

async function renderCode(el) {
  const d = await adminCall('/api/admin/code');
  const depHtml = d.deploys.connected ? `<table class="mb-5"><thead><tr><th>Deploy</th><th>Status</th><th>Commit</th><th>Started</th></tr></thead><tbody>${d.deploys.items.map((x) => `<tr><td>${escapeHtml(String(x.id).slice(-8))}</td><td>${escapeHtml(x.status)}</td><td>${escapeHtml(x.commit || '')} ${escapeHtml(x.message || '')}</td><td>${x.at ? new Date(x.at).toLocaleString() : ''}</td></tr>`).join('')}</tbody></table>` : `<p class="text-sm text-[var(--muted)] mb-5">${escapeHtml(d.deploys.note)}</p>`;
  const comHtml = d.commits.connected ? `<table><thead><tr><th>Commit</th><th>Message</th><th>Who</th><th>When</th></tr></thead><tbody>${d.commits.items.map((c) => `<tr><td>${escapeHtml(c.sha)}</td><td>${escapeHtml(c.message)}</td><td>${escapeHtml(c.author)}</td><td>${c.at ? new Date(c.at).toLocaleString() : ''}</td></tr>`).join('')}</tbody></table>` : `<p class="text-sm text-[var(--muted)]">${escapeHtml(d.commits.note)}</p>`;
  el.innerHTML = `<p class="text-sm mb-3">Running <b>${escapeHtml(d.version)}</b> since ${new Date(d.runningSince).toLocaleString()} · ${escapeHtml(d.repo)} (${escapeHtml(d.branch)})</p><h3 class="font-display font-bold mb-2">Deploys</h3>${depHtml}<h3 class="font-display font-bold mb-2">Latest commits</h3>${comHtml}`;
}

async function renderDocs(el) {
  const { links } = await adminCall('/api/admin/docs');
  el.innerHTML = `<ul class="text-sm space-y-1">${links.map((l) => `<li><a class="underline" target="_blank" rel="noopener" href="${escapeHtml(l.url)}">${escapeHtml(l.title)}</a></li>`).join('')}</ul>`;
}

async function renderOps(el) {
  el.innerHTML = `
    <h3 class="font-display font-bold mb-2">Test connections</h3>
    <p class="text-xs text-[var(--muted)] mb-2">One harmless read-only call per provider. Nothing is changed.</p>
    <button id="opsTest" class="tab-btn mb-3">Run test</button>
    <div id="opsTestOut"></div>
    <h3 class="font-display font-bold mt-6 mb-2">Actions</h3>
    <p class="text-xs text-[var(--muted)] mb-2">Each action needs your password again and a reason, has a cooldown, and is recorded. A redeploy restarts the site and wipes builds in progress.</p>
    <div class="flex flex-wrap gap-2 text-sm mb-2">
      <input id="opsPassword" type="password" autocomplete="current-password" class="border border-[var(--line)] rounded px-2 py-1" placeholder="Your password">
      <input id="opsReason" class="border border-[var(--line)] rounded px-2 py-1" placeholder="Reason (typed)" style="min-width:220px">
      <label class="flex items-center gap-1"><input id="opsForce" type="checkbox"> force even if builds are running</label>
    </div>
    <div class="flex flex-wrap gap-2 mb-2"><button id="opsRedeploy" class="tab-btn">Redeploy</button><button id="opsClear" class="tab-btn">Clear caches</button></div>
    <p id="opsMsg" class="text-sm mb-4"></p>
    <h3 class="font-display font-bold mb-2">Rotate a key (guided, never one click)</h3>
    <ol id="opsChecklist" class="text-sm list-decimal pl-5 space-y-1"></ol>`;
  const usd = (n) => (n < 0 ? '-$' : '$') + Math.abs(Number(n)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function balanceCard(b) {
    if (!b) return '';
    const cell = (label, value, tone) => `<div style="flex:1 1 110px;min-width:110px"><div style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.04em">${escapeHtml(label)}</div><div style="font-size:20px;font-weight:700;color:${escapeHtml(tone || 'inherit')}">${escapeHtml(value)}</div></div>`;
    const low = b.remainingUsd != null && b.remainingUsd <= 5;
    const cellsHtml = b.limitUsd == null
      ? cell('Spent so far', usd(b.usedUsd)) + cell('Credit limit', 'No limit set')
      : cell('Remaining', usd(b.remainingUsd), b.remainingUsd <= 0 ? '#c2410c' : low ? '#b45309' : '#15803d') + cell('Spent', usd(b.usedUsd)) + cell('Limit', usd(b.limitUsd));
    const warnHtml = b.remainingUsd != null && b.remainingUsd <= 0 ? '<div style="margin-top:8px;font-size:13px;color:#c2410c;font-weight:600">Out of credit: paid models will fail until it is topped up.</div>' : low ? '<div style="margin-top:8px;font-size:13px;color:#b45309;font-weight:600">Running low: top up soon.</div>' : '';
    return `<div style="margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff"><div style="font-weight:700;margin-bottom:8px">AI credit balance</div><div style="display:flex;flex-wrap:wrap;gap:12px">${cellsHtml}</div>${warnHtml}</div>`;
  }
  document.getElementById('opsTest').addEventListener('click', async (ev) => {
    ev.target.disabled = true;
    const out = document.getElementById('opsTestOut');
    out.textContent = 'Testing…';
    try {
      const { results } = await adminCall('/api/admin/ops/test-connections', { method: 'POST', body: {} });
      const colour = { ok: '#15803d', 'not set': '#64748b', rejected: '#c2410c', failed: '#c2410c' };
      out.innerHTML = `<table><thead><tr><th>Provider</th><th>Result</th><th>Detail</th></tr></thead><tbody>${results.map((r) => `<tr><td>${escapeHtml(r.name)}</td><td style="color:${escapeHtml(colour[r.state] || '#000')};font-weight:600">${escapeHtml(r.state)}${r.ms != null ? ` (${r.ms} ms)` : ''}</td><td>${escapeHtml(r.detail || '')}</td></tr>`).join('')}</tbody></table>${balanceCard((results.find((r) => r.balance) || {}).balance)}`;
    } catch (err) { out.textContent = err.message; }
    ev.target.disabled = false;
  });
  adminCall('/api/admin/ops').then((o) => { document.getElementById('opsChecklist').innerHTML = o.rotationChecklist.map((t) => `<li>${escapeHtml(t)}</li>`).join(''); }).catch(() => {});
  const doOp = async (action, label) => {
    const msg = document.getElementById('opsMsg');
    const body = { password: document.getElementById('opsPassword').value, reason: document.getElementById('opsReason').value.trim(), force: document.getElementById('opsForce').checked };
    if (!body.password || body.reason.length < 5) { msg.textContent = 'Enter your password and a reason of at least 5 characters.'; return; }
    if (!confirm(`${label}? This is recorded.`)) return;
    msg.textContent = 'Working…';
    try {
      const r = await adminCall(`/api/admin/ops/${action}`, { method: 'POST', body });
      document.getElementById('opsPassword').value = '';
      msg.textContent = action === 'redeploy' ? `Redeploy started${r.deployId ? ` (${r.deployId})` : ''}. The site restarts in a minute or two.` : `Cleared: ${r.cleared.join('; ')}.`;
    } catch (err) { msg.textContent = err.message; }
  };
  document.getElementById('opsRedeploy').addEventListener('click', () => doOp('redeploy', 'Redeploy the live site now'));
  document.getElementById('opsClear').addEventListener('click', () => doOp('clear-cache', 'Clear the admin caches'));
}

const RANK = { viewer: 0, engineer: 1, team_lead: 2, admin: 3, owner: 4 };
async function renderTeam(el) {
  const d = await adminCall('/api/admin/team');
  const me = d.members.find((m) => m.id === d.you);
  const myRank = me ? RANK[me.role] : -1;
  el.innerHTML = `
    <p class="text-xs text-[var(--muted)] mb-3">You can create and manage roles below your own. Credentials are shown once and stored only as hashes. (Email + key login arrives with the security session work.)</p>
    <div id="teamSecret"></div>
    <table class="mb-5">
      <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last login</th><th></th></tr></thead>
      <tbody>${d.members.map((m) => {
        const manage = m.id !== d.you && RANK[m.role] < myRank;
        return `<tr><td>${escapeHtml(m.name)}${m.id === d.you ? ' (you)' : ''}</td><td>${escapeHtml(m.role.replace('_', ' '))}</td><td>${m.active ? 'active' : '<b>revoked</b>'}</td><td>${m.last_login_at ? new Date(m.last_login_at).toLocaleString() : 'never'}</td><td>${manage ? `
          <select data-role-of="${escapeHtml(m.id)}">${d.assignable.map((r) => `<option ${r === m.role ? 'selected' : ''}>${escapeHtml(r)}</option>`).join('')}</select>
          <button class="tab-btn" data-act="role" data-id="${escapeHtml(m.id)}">Set role</button>
          <button class="tab-btn" data-act="${m.active ? 'revoke' : 'restore'}" data-id="${escapeHtml(m.id)}">${m.active ? 'Revoke' : 'Restore'}</button>
          <button class="tab-btn" data-act="regen" data-id="${escapeHtml(m.id)}">New credentials</button>` : ''}</td></tr>`;
      }).join('')}</tbody>
    </table>
    ${d.assignable.length ? `<div class="flex flex-wrap gap-2 text-sm">
      <input id="tmName" class="border border-[var(--line)] rounded px-2 py-1" placeholder="Name">
      <select id="tmRole" class="border border-[var(--line)] rounded px-2 py-1">${d.assignable.map((r) => `<option>${escapeHtml(r)}</option>`).join('')}</select>
      <button id="tmCreate" class="tab-btn">Add team member</button></div>` : ''}`;
  const showSecret = (r) => {
    document.getElementById('teamSecret').innerHTML = `<div class="border-2 border-[var(--orange)] rounded-xl bg-white p-4 mb-4"><b>${escapeHtml(r.name)}</b>: save these now. They will not be shown again.<br>Access code: <code>${escapeHtml(r.accessCode)}</code><br>Password: <code>${escapeHtml(r.password)}</code></div>`;
  };
  const reasonFor = (what) => { const r = prompt(`Reason for: ${what}?`); return r && r.trim().length >= 3 ? r.trim() : null; };
  const run = async (fn) => { try { await fn(); await renderTeam(el); } catch (err) { alert(err.message); } };
  el.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.id; const act = b.dataset.act;
    if (act === 'role') {
      const role = el.querySelector(`[data-role-of="${id}"]`).value; const reason = reasonFor(`change role to ${role}`);
      if (reason) run(() => adminCall(`/api/admin/team/${id}/role`, { method: 'POST', body: { role, reason } }));
    } else if (act === 'revoke' || act === 'restore') {
      const reason = reasonFor(act === 'revoke' ? 'revoke access' : 'restore access');
      if (reason && confirm(act === 'revoke' ? 'Revoke this person now?' : 'Restore this person?')) run(() => adminCall(`/api/admin/team/${id}/active`, { method: 'POST', body: { active: act === 'restore', reason } }));
    } else if (act === 'regen') {
      const reason = reasonFor('issue new credentials (the old ones stop working)');
      if (reason && confirm('The old access code and password stop working at once. Continue?')) run(async () => { showSecret(await adminCall(`/api/admin/team/${id}/regenerate`, { method: 'POST', body: { reason } })); });
    }
  }));
  const create = document.getElementById('tmCreate');
  if (create) create.addEventListener('click', async () => {
    const name = document.getElementById('tmName').value.trim(); const role = document.getElementById('tmRole').value;
    const reason = reasonFor(`add ${name || 'a member'} as ${role}`);
    if (!name || !reason) return;
    try { const r = await adminCall('/api/admin/team', { method: 'POST', body: { name, role, reason } }); await renderTeam(el); showSecret(r); } catch (err) { alert(err.message); }
  });
}

async function renderMemory(el) {
  const d = await adminCall('/api/admin/design-memory');
  const names = Object.keys(d.industries);
  if (!names.length) {
    el.innerHTML = `<p class="text-sm">No builds recorded yet (${d.totalBuilds} so far). Designs are recorded once the section library and the Premium Pipeline are on (SECTION_LIBRARY=1 and PREMIUM_PIPELINE=1); after ${d.minIndustryBuilds} builds in an industry, the builder starts leading with what scores and survives best.</p>`;
    return;
  }
  el.innerHTML = `<p class="text-xs text-[var(--muted)] mb-3">${d.totalBuilds} builds recorded. Structure only (industry, sections, palette, score): never a person's words or details.</p>` + names.map((n) => {
    const i = d.industries[n];
    const learnBadge = i.learning ? '<span class="badge" style="background:#dcfce7;color:#166534">learning: leads with the best combination</span>' : `<span class="badge" style="background:#ffedd5;color:#9a3412">${i.buildsToLearn} more builds before it learns</span>`;
    return `<div class="border border-[var(--line)] rounded-xl bg-white p-4 mb-3">
      <p class="font-display font-bold mb-1">${escapeHtml(n)} <span class="text-sm font-normal text-[var(--muted)]">${i.builds} builds · average score ${i.meanScore}</span></p>
      <p class="mb-2">${learnBadge}</p>
      <table><thead><tr><th>Top combination</th><th>Builds</th><th>Score</th><th>Kept</th><th>Deleted</th><th>Value</th></tr></thead>
      <tbody>${i.topCombos.map((c) => `<tr><td style="word-break:break-word">${escapeHtml(c.sections.map((x) => x.id + '.' + x.variant).join(' '))} · ${escapeHtml(c.palette || '')}</td><td>${c.builds}</td><td>${c.meanScore}</td><td>${Math.round(c.keptRate * 100)}%</td><td>${Math.round(c.deletedRate * 100)}%</td><td>${escapeHtml(String(c.value))}</td></tr>`).join('')}</tbody></table>
      ${i.sectionWins.length ? `<p class="text-xs text-[var(--muted)] mt-2">Sections that win most: ${i.sectionWins.map((w) => escapeHtml(w.section) + ' (' + w.count + ')').join(', ')}</p>` : ''}
    </div>`;
  }).join('');
}

// Small shared pieces for the older tabs: every value is escaped; empty states say what is missing.
const tile = (label, value, sub, tone) => `<div class="bg-white border border-[var(--line)] rounded-xl p-4"><p class="text-xs text-[var(--muted)] mb-1">${escapeHtml(label)}</p><p class="font-display font-bold text-xl" style="${tone ? 'color:' + escapeHtml(tone) : ''}">${escapeHtml(value)}</p>${sub ? `<p class="text-xs text-[var(--muted)] mt-1">${escapeHtml(sub)}</p>` : ''}</div>`;
const pill = (text, bg, fg) => `<span class="badge" style="background:${escapeHtml(bg)};color:${escapeHtml(fg)}">${escapeHtml(text)}</span>`;
const empty = (text) => `<p class="text-sm text-[var(--muted)] border border-dashed border-[var(--line)] rounded-xl p-4 bg-white">${escapeHtml(text)}</p>`;
const num = (n) => (Number.isFinite(Number(n)) ? Number(n).toLocaleString('en-US') : '-');
const money = (n) => '$' + (Number(n) || 0).toFixed(2);

async function renderUsage(el) {
  const { byModel, totalCost, recentCalls } = await adminCall('/api/admin/api-usage');
  const rows = Object.entries(byModel || {}).sort((x, y) => y[1].cost - x[1].cost);
  const calls = rows.reduce((t, [, d]) => t + d.calls, 0);
  const tokens = rows.reduce((t, [, d]) => t + d.inputTokens + d.outputTokens, 0);
  if (!rows.length) { el.innerHTML = empty('No AI calls recorded yet.'); return; }
  el.innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
      ${tile('Total cost', money(totalCost), 'last 500 calls')}${tile('Calls', num(calls))}${tile('Tokens', num(tokens))}${tile('Models used', String(rows.length))}
    </div>
    <div class="overflow-x-auto"><table>
      <thead><tr><th>Model</th><th>Calls</th><th>Input tokens</th><th>Output tokens</th><th>Cost</th><th>Share</th></tr></thead>
      <tbody>${rows.map(([model, d]) => {
        const sharePct = totalCost > 0 ? Math.round((d.cost / totalCost) * 100) : 0;
        return `<tr><td style="word-break:break-word">${escapeHtml(model)}</td><td>${num(d.calls)}</td><td>${num(d.inputTokens)}</td><td>${num(d.outputTokens)}</td><td>${money(d.cost)}</td><td style="min-width:90px"><div style="background:#e2e8f0;border-radius:4px;height:8px"><div style="background:#0f766e;width:${sharePct}%;height:8px;border-radius:4px"></div></div><span class="text-xs text-[var(--muted)]">${sharePct}%</span></td></tr>`;
      }).join('')}</tbody>
    </table></div>`;
}

async function renderHealth(el) {
  const data = await adminCall('/api/admin/system-health');
  const h = data.lastHour || {};
  const secs = Number(data.processUptimeSeconds) || 0;
  const up = secs >= 86400 ? `${Math.floor(secs / 86400)}d ${Math.floor((secs % 86400) / 3600)}h` : secs >= 3600 ? `${Math.floor(secs / 3600)}h ${Math.floor((secs % 3600) / 60)}m` : `${Math.floor(secs / 60)}m`;
  const err = Number(h.errorRate) || 0, ms = Number(h.avgDurationMs) || 0;
  const errTone = err >= 5 ? '#c2410c' : err >= 1 ? '#b45309' : '#15803d';
  const msTone = ms >= 3000 ? '#c2410c' : ms >= 1000 ? '#b45309' : '#15803d';
  const statusPill = err >= 5 || ms >= 3000 ? pill('Needs attention', '#ffedd5', '#9a3412') : err >= 1 || ms >= 1000 ? pill('Watch', '#fef3c7', '#92400e') : pill('Healthy', '#dcfce7', '#166534');
  el.innerHTML = `
    <p class="mb-3">${statusPill} <span class="text-xs text-[var(--muted)]">Based on the last hour. Amber from 1% errors or 1s responses; red from 5% or 3s.</span></p>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      ${tile('Uptime', up, 'since the last deploy')}${tile('Requests (1h)', num(h.totalRequests))}${tile('Error rate', err + '%', 'server errors (5xx)', errTone)}${tile('Avg response', ms + ' ms', null, msTone)}
    </div>
    ${Number(h.totalRequests) === 0 ? '<p class="text-xs text-[var(--muted)] mt-3">No requests in the last hour, so the rates above are not meaningful yet.</p>' : ''}`;
}

// Proactive log: what each assistant said without being asked, and what happened to it. Text only, never HTML.
async function renderProactive(el) {
  el.textContent = '';
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let data;
  try { data = await adminCall('/api/admin/proactive-log'); }
  catch (e) { el.appendChild(mk('p', 'text-sm text-red-600', (e && e.message) || 'The proactive log could not be loaded.')); return; }
  const rows = data.rows || [];
  el.appendChild(mk('p', 'text-xs text-[var(--muted)] mb-3', 'What the assistants said unasked (plain rules, no AI cost). New = waiting, Seen = opened, Dismissed = "Got it". Each line shows the evidence it came from.'));
  const sum = Object.entries(data.byBot || {}).map(([b, n]) => b + ': ' + n).join('   ') + '    |    ' + Object.entries(data.byStatus || {}).map(([b, n]) => b + ': ' + n).join('   ');
  el.appendChild(mk('p', 'text-sm mb-3', rows.length ? sum : 'Nothing yet: no assistant has spoken up.'));
  if (!rows.length) return;
  const wrap = mk('div', 'overflow-x-auto'), table = mk('table'), head = mk('thead'), hr = mk('tr');
  ['When', 'User', 'Bot', 'Kind', 'Status', 'Said', 'Evidence'].forEach((h) => hr.appendChild(mk('th', null, h)));
  head.appendChild(hr); table.appendChild(head);
  const body = mk('tbody');
  rows.forEach((r) => {
    const tr = mk('tr');
    [new Date(r.created_at).toLocaleString(), String(r.user_id || '').slice(0, 8) + '…', r.bot_id, r.kind + (r.severity === 'alert' ? ' (alert)' : ''), r.status, r.text, r.why || '-'].forEach((v) => { const td = mk('td', null, v); td.style.wordBreak = 'break-word'; tr.appendChild(td); });
    body.appendChild(tr);
  });
  table.appendChild(body); wrap.appendChild(table); el.appendChild(wrap);
}

// Connected tools: which outside tools are switched on. Settings are checked for presence only; text only, never HTML.
async function renderTools(el) {
  el.textContent = '';
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let data;
  try { data = await adminCall('/api/admin/connected-tools'); }
  catch (e) { el.appendChild(mk('p', 'text-sm text-red-600', (e && e.message) || 'The connected tools could not be loaded.')); return; }
  el.appendChild(mk('p', 'text-xs text-[var(--muted)] mb-3', 'Which outside tools the assistants can use. Only whether a setting exists is checked; values and keys are never shown.'));
  const label = { on: 'On', partly: 'Partly', off: 'Off' };
  (data.tools || []).forEach((t) => {
    const card = mk('div', 'border border-[var(--line)] rounded-xl p-4 mb-3');
    card.appendChild(mk('p', 'font-semibold text-sm', t.name + ': ' + (label[t.state] || t.state)));
    card.appendChild(mk('p', 'text-sm', t.detail || ''));
    if (t.note) card.appendChild(mk('p', 'text-xs text-[var(--muted)] mt-1', t.note));
    el.appendChild(card);
  });
}

// Business Assistant audit trail: newest first, with filters. Every value is
// put on the page as text (never HTML). The JSON route is the source of truth.
async function renderAudit(el) {
  el.textContent = '';
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const bar = mk('div', 'flex flex-wrap gap-2 mb-3');
  const event = mk('select', 'field-input'); event.style.width = 'auto';
  [['', 'All events'], ['chat', 'Chat'], ['tool_call', 'Tool calls'], ['approval', 'Approvals'], ['memory', 'Memory'], ['error', 'Errors']].forEach(([v, t]) => { const o = mk('option', null, t); o.value = v; event.appendChild(o); });
  const bot = mk('select', 'field-input'); bot.style.width = 'auto';
  [['', 'All bots'], ['sales', 'Sales'], ['hr', 'HR'], ['finance', 'Finance'], ['payroll', 'Payroll'], ['support', 'Support'], ['custom', 'Custom']].forEach(([v, t]) => { const o = mk('option', null, t); o.value = v; bot.appendChild(o); });
  const user = mk('input', 'field-input'); user.style.width = '220px'; user.placeholder = 'User id (optional)';
  const go = mk('button', 'tab-btn active', 'Show');
  bar.append(event, bot, user, go);
  const note = mk('p', 'text-xs text-[var(--muted)] mb-3', 'What the assistant did, newest first. Message text, email bodies and secrets are never stored here.');
  const msg = mk('p', 'text-sm text-red-600 mb-2');
  const wrap = mk('div', 'overflow-x-auto');
  const table = mk('table');
  const head = mk('thead'); const hr = mk('tr');
  ['When', 'User', 'Bot', 'Event', 'Tool', 'OK', 'Asked for', 'Answered by', 'Approved', 'Input', 'Result', 'IP'].forEach((h) => hr.appendChild(mk('th', null, h)));
  head.appendChild(hr); table.appendChild(head);
  const body = mk('tbody'); table.appendChild(body); wrap.appendChild(table);
  const more = mk('button', 'tab-btn', 'Load older'); more.hidden = true; more.style.marginTop = '12px';
  el.append(bar, note, msg, wrap, more);

  let oldest = null;
  async function load(append) {
    msg.textContent = '';
    const q = new URLSearchParams({ limit: '50' });
    if (event.value) q.set('event', event.value);
    if (bot.value) q.set('bot', bot.value);
    if (user.value.trim()) q.set('user', user.value.trim());
    if (append && oldest) q.set('before', oldest);
    try {
      const { entries } = await adminCall('/api/admin/audit?' + q.toString());
      if (!append) { body.textContent = ''; }
      entries.forEach((r) => {
        const tr = mk('tr');
        [new Date(r.created_at).toLocaleString(), (r.user_id || '').slice(0, 8) + '…', r.bot_type || '-', r.event, r.tool_used || '-', r.ok === null ? '-' : r.ok ? 'yes' : 'no',
          r.model_requested || '-', r.model_used || '-', r.approved_by_user === null ? '-' : r.approved_by_user ? 'approved' : 'cancelled', r.input || '-', r.output || '-', r.ip_address || '-']
          .forEach((v, i) => {
            const td = mk('td', null, v);
            if (i === 5 && v === 'no') td.style.cssText = 'color:#c2410c;font-weight:700';
            if (i === 5 && v === 'yes') td.style.color = '#15803d';
            if (i === 3 && v === 'error') td.style.cssText = 'color:#c2410c;font-weight:700';
            tr.appendChild(td);
          });
        body.appendChild(tr);
      });
      if (entries.length) oldest = entries[entries.length - 1].created_at;
      more.hidden = entries.length < 50;
      if (!append && !entries.length) { msg.className = 'text-sm text-[var(--muted)] mb-2'; msg.textContent = 'Nothing recorded yet for this filter.'; } else msg.className = 'text-sm text-red-600 mb-2';
    } catch (err) { msg.textContent = err.message; }
  }
  go.addEventListener('click', () => { oldest = null; load(false); });
  more.addEventListener('click', () => load(true));
  await load(false);
}

document.addEventListener('DOMContentLoaded', () => {
  if (adminToken) showDashboard();
});
</script>
</body>
</html>
