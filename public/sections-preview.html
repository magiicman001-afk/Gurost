fore,\n.g-page *::after {\n  box-sizing: border-box;\n}\n\n/* zero-specificity element reset inside sections */\n:where([data-gurost-section]) :where(h1, h2, h3, h4, p, ul, ol, figure, blockquote) {\n  margin: 0;\n}\n:where([data-gurost-section]) :where(ul, ol) {\n  padding: 0;\n  list-style: none;\n}\n:where([data-gurost-section]) :where(img, svg, video) {\n  display: block;\n  max-width: 100%;\n}\n:where([data-gurost-section]) :where(a) {\n  color: inherit;\n  text-decoration: none;\n}\n:where([data-gurost-section]) :where(h1, h2, h3, h4) {\n  font-family: var(--g-font-head, inherit);\n  line-height: 1.15;\n}\n\n.g-container {\n  width: 100%;\n  max-width: var(--g-max);\n  margin-inline: auto;\n  padding-inline: var(--g-s2);\n}\n@media (min-width: 880px) {\n  .g-container {\n    padding-inline: var(--g-s4);\n  }\n}\n\n/* buttons shared by all sections */\n.g-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-height: var(--g-tap);\n  padding: 0 var(--g-s3);\n  border: 2px solid transparent;\n  border-radius: var(--g-radius-btn);\n  font-family: var(--g-font-body, inherit);\n  font-size: var(--g-t-16);\n  font-weight: 600;\n  line-height: 1.2;\n  text-align: center;\n  text-decoration: none;\n  cursor: pointer;\n}\n.g-btn--primary {\n  background: var(--g-primary);\n  color: var(--g-on-primary);\n}\n.g-btn--accent {\n  background: var(--g-accent);\n  color: var(--g-on-accent);\n}\n.g-btn--ghost {\n  background: transparent;\n  color: var(--g-primary);\n  border-color: var(--g-primary);\n}\n.g-btn--inverse {\n  background: var(--g-on-primary);\n  color: var(--g-primary);\n}\n\n/* keyboard focus */\n.g-page :focus-visible {\n  outline: 2px solid var(--g-focus);\n  outline-offset: 2px;\n}\n[data-tone=\"dark\"] :focus-visible {\n  outline-color: var(--g-on-dark);\n}\n\n/* skip link and screen-reader-only text */\n.g-skip,\n.g-sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  margin: -1px;\n  padding: 0;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n.g-skip:focus {\n  position: fixed;\n  top: var(--g-s1);\n  left: var(--g-s1);\n  width: auto;\n  height: auto;\n  margin: 0;\n  padding: var(--g-s1) var(--g-s2);\n  clip: auto;\n  z-index: 100;\n  background: var(--g-primary);\n  color: var(--g-on-primary);\n  border-radius: var(--g-radius);\n}\n\n/* motion hooks: content is visible by default; only a page that adds .g-js may start hidden */\n@media (prefers-reduced-motion: reduce) {\n  .g-js [data-g-reveal] {\n    opacity: 1;\n    transform: none;\n  }\n}\n\n/* Navbar A / B / C. Colours come from palette variables only, except the documented top scrim on C. */\n.g-navbar {\n  position: relative;\n  z-index: 50;\n  background: var(--g-surface);\n  color: var(--g-text);\n  border-bottom: 1px solid var(--g-border);\n}\n.g-navbar[data-tone=\"dark\"] {\n  background: var(--g-dark);\n  color: var(--g-on-dark);\n  border-bottom-color: transparent;\n}\n.g-navbar--sticky {\n  position: sticky;\n  top: 0;\n}\n.g-navbar__inner {\n  min-height: 64px;\n}\n.g-navbar__nav {\n  position: relative;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  min-height: 64px;\n  gap: var(--g-s2);\n}\n.g-navbar__brand {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--g-s1);\n  min-height: var(--g-tap);\n  font-family: var(--g-font-head);\n  font-size: var(--g-t-20);\n  font-weight: 700;\n  line-height: 1.1;\n  overflow-wrap: anywhere;\n}\n.g-navbar__logo {\n  width: 32px;\n  height: 32px;\n  object-fit: contain;\n}\n.g-navbar__panel {\n  display: flex;\n  align-items: center;\n  gap: var(--g-s4);\n}\n.g-navbar__links {\n  display: flex;\n  align-items: center;\n  gap: var(--g-s1);\n}\n.g-navbar__links a {\n  display: inline-flex;\n  align-items: center;\n  min-height: var(--g-tap);\n  padding: 0 var(--g-s1);\n  font-size: var(--g-t-16);\n  font-weight: 600;\n  border-bottom: 2px solid transparent;\n}\n.g-navbar__links a:hover {\n  border-bottom-color: var(--g-primary);\n}\n.g-navbar[data-tone=\"dark\"] .g-navbar__links a:hover {\n  border-bottom-color: var(--g-on-dark);\n}\n.g-navbar__actions {\n  display: flex;\n  align-items: center;\n  gap: var(--g-s2);\n}\n.g-navbar__phone {\n  display: inline-flex;\n  align-items: center;\n  min-height: var(--g-tap);\n  font-weight: 600;\n  white-space: nowrap;\n}\n.g-navbar__cta {\n  white-space: nowrap;\n}\n.g-navbar[data-tone=\"dark\"] .g-btn--primary {\n  background: var(--g-on-dark);\n  color: var(--g-dark);\n}\n\n/* menu button: only exists when the script ran (.g-js) and the screen is small */\n.g-navbar__menu-btn {\n  display: none;\n  position: relative;\n  width: var(--g-tap);\n  height: var(--g-tap);\n  padding: 0;\n  border: 0;\n  border-radius: var(--g-radius-btn);\n  background: transparent;\n  color: inherit;\n  cursor: pointer;\n}\n.g-navbar__bars,\n.g-navbar__bars::before,\n.g-navbar__bars::after {\n  position: absolute;\n  left: 11px;\n  width: 22px;\n  height: 2px;\n  background: currentColor;\n  content: \"\";\n}\n.g-navbar__bars {\n  top: 21px;\n}\n.g-navbar__bars::before {\n  top: -7px;\n  left: 0;\n}\n.g-navbar__bars::after {\n  top: 7px;\n  left: 0;\n}\n.is-open .g-navbar__bars {\n  background: transparent;\n}\n.is-open .g-navbar__bars::before {\n  top: 0;\n  transform: rotate(45deg);\n}\n.is-open .g-navbar__bars::after {\n  top: 0;\n  transform: rotate(-45deg);\n}\n\n/* variant B: centred brand, links on both sides */\n@media (min-width: 880px) {\n  .g-navbar--b .g-navbar__nav {\n    display: grid;\n    grid-template-columns: 1fr auto 1fr;\n  }\n  .g-navbar--b .g-navbar__panel {\n    display: contents;\n  }\n  .g-navbar--b .g-navbar__brand {\n    grid-column: 2;\n    grid-row: 1;\n    justify-self: center;\n  }\n  .g-navbar--b .g-navbar__links--left {\n    grid-column: 1;\n    grid-row: 1;\n    justify-self: start;\n  }\n  .g-navbar--b .g-navbar__right {\n    grid-column: 3;\n    grid-row: 1;\n    justify-self: end;\n    display: flex;\n    align-items: center;\n    gap: var(--g-s3);\n  }\n}\n\n/* variant C: transparent over the hero, solid after scrolling */\n.g-navbar--c {\n  position: absolute;\n  top: 0;\n  left: 0;\n  right: 0;\n  background: linear-gradient(to bottom, rgba(0, 0, 0, 0.6), transparent);\n  color: var(--g-on-dark);\n  border-bottom-color: transparent;\n}\n.g-navbar--c.is-solid {\n  position: fixed;\n  background: var(--g-surface);\n  color: var(--g-text);\n  border-bottom-color: var(--g-border);\n}\n.g-navbar--c.is-solid .g-btn--inverse {\n  background: var(--g-primary);\n  color: var(--g-on-primary);\n}\n.g-navbar--c.is-solid .g-navbar__links a:hover {\n  border-bottom-color: var(--g-primary);\n}\n.g-navbar--c .g-navbar__links a:hover {\n  border-bottom-color: var(--g-on-dark);\n}\n\n/* phones and small tablets: drawer */\n@media (max-width: 879px) {\n  .g-js .g-navbar__menu-btn {\n    display: inline-block;\n  }\n  .g-js .g-navbar--b .g-navbar__menu-btn {\n    order: -1;\n  }\n  .g-js .g-navbar--b .g-navbar__nav {\n    justify-content: flex-start;\n  }\n  .g-js .g-navbar--b .g-navbar__brand {\n    flex: 1;\n    justify-content: center;\n    margin-right: var(--g-tap);\n  }\n  .g-js .g-navbar__panel {\n    display: none;\n    position: absolute;\n    top: 100%;\n    left: calc(var(--g-s2) * -1);\n    right: calc(var(--g-s2) * -1);\n    flex-direction: column;\n    align-items: stretch;\n    gap: var(--g-s2);\n    padding: var(--g-s2);\n    background: var(--g-surface);\n    color: var(--g-text);\n    border-bottom: 1px solid var(--g-border);\n    box-shadow: var(--g-shadow);\n  }\n  .g-js .g-navbar[data-tone=\"dark\"] .g-navbar__panel,\n  .g-js .g-navbar--c .g-navbar__panel {\n    background: var(--g-dark);\n    color: var(--g-on-dark);\n  }\n  .g-js .g-navbar--c.is-solid .g-navbar__panel {\n    background: var(--g-surface);\n    color: var(--g-text);\n  }\n  .g-js .is-open .g-navbar__panel {\n    display: flex;\n  }\n  /* without script the links simply wrap
