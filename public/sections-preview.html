<style>
  :root { color-scheme: light; --bg:#f4f4f5; --fg:#18181b; --line:#d4d4d8; --ink:#27272a; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header.pv { background:#fff; border-bottom:1px solid var(--line); padding:12px 16px; }
  header.pv h1 { margin:0 0 4px; font-size:17px; }
  .row { display:flex; gap:8px; align-items:center; margin-top:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; }
  .row > span { display:flex; gap:8px; }
  select.pick { min-height:44px; font:inherit; padding:0 12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); max-width:100%; }
  .row b { flex:none; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:#52525b; min-width:64px; }
  button.chip { flex:none; white-space:nowrap; min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:999px; background:#fff; font:inherit; cursor:pointer; color:var(--ink); }
  button.chip[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; border:1px solid rgba(0,0,0,.2); }
  main.pv { padding:16px; }
  .note { font-size:13px; color:#52525b; margin:0 0 12px; }
  .stage { display:flex; justify-content:center; }
  main.pv { padding:12px 0; }
  .note { padding:0 16px; }
  iframe { display:block; border:1px solid var(--line); background:#fff; width:100%; max-width:100%; height:400px; }
  iframe.w375 { width:375px; max-width:100%; }
  iframe.w1440 { width:1440px; }
  .scroll { overflow:auto; }
</style>
</head>

x;\n  --g-s6: 48px;\n  --g-s8: 64px;\n  --g-s12: 96px;\n  /* shape */\n  --g-radius: 12px;\n  --g-radius-btn: 999px;\n  --g-shadow: 0 8px 24px -12px var(--g-border);\n  --g-max: 1200px;\n  --g-tap: 44px;\n}\n@supports (color: color-mix(in srgb, red, blue)) {\n  :root {\n    --g-shadow: 0 8px 24px -12px color-mix(in srgb, var(--g-text) 35%, transparent);\n  }\n}\n\n/* page shell: the assembler puts class=\"g-page\" on \u003cbody> */\n.g-page {\n  margin: 0;\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n  font-kerning: normal;\n  font-family: var(--g-font-body, system-ui, sans-serif);\n  font-size: var(--g-t-16);\n  line-height: 1.6;\n  color: var(--g-text);\n  background: var(--g-bg);\n  -webkit-text-size-adjust: 100%;\n  overflow-x: hidden;\n}\n.g-page *,\n.g-page *::before,\n.g-page *::after {\n  box-sizing: border-box;\n}\n\n/* zero-specificity element reset inside sections */\n:where([data-gurost-section]) :where(h1, h2, h3, h4, p, ul, ol, figure, blockquote) {\n  margin: 0;\n}\n:where([data-gurost-section]) :where(ul, ol) {\n  padding: 0;\n  list-style: none;\n}\n:where([data-gurost-section]) :where(img, svg, video) {\n  display: block;\n  max-width: 100%;\n}\n:where([data-gurost-section]) :where(a) {\n  color: inherit;\n  text-decoration: none;\n}\n:where([data-gurost-section]) :where(h1, h2, h3, h4) {\n  font-family: var(--g-font-head, inherit);\n  line-height: 1.15;\n}\n\n.g-container {\n  width: 100%;\n  max-width: var(--g-max);\n  margin-inline: auto;\n  padding-inline: var(--g-s2);\n}\n@media (min-width: 880px) {\n  .g-container {\n    padding-inline: var(--g-s4);\n  }\n}\n\n/* buttons shared by all sections */\n.g-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  min-height: var(--g-tap);\n  padding: 0 var(--g-s3);\n  border: 2px solid transparent;\n  border-radius: var(--g-radius-btn);\n  font-family: var(--g-font-body, inherit);\n  font-size: var(--g-t-16);\n  font-weight: 600;\n  line-height: 1.2;\n  text-align: center;\n  text-decoration: none;\n  cursor: pointer;\n  max-width: 100%;\n  overflow-wrap: anywhere;\n}\n.g-btn--primary {\n  background: var(--g-primary);\n  color: var(--g-on-primary);\n}\n.g-btn--accent {\n  background: var(--g-accent);\n  color: var(--g-on-accent);\n}\n.g-btn--ghost {\n  background: transparent;\n  color: var(--g-primary);\n  border-color: var(--g-primary);\n}\n.g-btn--inverse {\n  background: var(--g-on-primary);\n  color: var(--g-primary);\n}\n\n/* keyboard focus */\n.g-page :focus-visible {\n  outline: 2px solid var(--g-focus);\n  outline-offset: 2px;\n}\n[data-tone=\"dark\"] :focus-visible {\n  outline-color: var(--g-on-dark);\n}\n\n/* skip link and screen-reader-only text */\n.g-skip,\n.g-sr-only {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  margin: -1px;\n  padding: 0;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n.g-skip:focus {\n  position: fixed;\n  top: var(--g-s1);\n  left: var(--g-s1);\n  width: auto;\n  height: auto;\n  margin: 0;\n  padding: var(--g-s1) var(--g-s2);\n  clip: auto;\n  z-index: 100;\n  background: var(--g-primary);\n  color: var(--g-on-primary);\n  border-radius: var(--g-radius);\n}\n\n/* motion hooks: content is visible by default; only a page that adds .g-js may start hidden */\n@media (prefers-reduced-motion: reduce) {\n  .g-js [data-g-reveal] {\n    opacity: 1;\n    transform: none;\n  }\n}\n\n/* shared section frame: used by every content section (Trust Bar, Features, About, Services, ...) */\n.g-sec {\n  padding-block: var(--g-s8);\n  background: var(--g-bg);\n  color: var(--g-text);\n}\n.g-sec--tight {\n  padding-block: var(--g-s4);\n}\n.g-sec--surface {\n  background: var(--g-surface);\n}\n.g-sec[data-tone=\"dark\"] {\n  background: var(--g-dark);\n  color: var(--g-on-dark);\n}\n@media (min-width: 880px) {\n  .g-sec {\n    padding-block: var(--g-s12);\n  }\n  .g-sec--tight {\n    padding-block: var(--g-s6);\n  }\n}\n.g-head {\n  max-width: 720px;\n  margin-bottom: var(--g-s6);\n}\n.g-head--center {\n  margin-inline: auto;\n  text-align: center;\n}\n.g-eyebrow {\n  margin-bottom: var(--g-s1);\n  font-size: var(--g-t-14);\n  font-weight: 600;\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--g-primary);\n  overflow-wrap: anywhere;\n}\n.g-title {\n  font-size: var(--g-t-32);\n  font-weight: 700;\n  overflow-wrap: anywhere;\n}\n.g-lead {\n  margin-top: var(--g-s2);\n  font-size: var(--g-t-20);\n  color: var(--g-muted);\n  overflow-wrap: anywhere;\n}\n.g-sec[data-tone=\"dark\"] .g-eyebrow {\n  color: var(--g-on-dark);\n}\n.g-sec[data-tone=\"dark\"] .g-lead {\n  color: var(--g-on-dark-muted);\n}\n.g-icon {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  flex: none;\n  width: var(--g-tap);\n  height: var(--g-tap);\n  border-radius: var(--g-radius);\n  background: var(--g-surface);\n  color: var(--g-primary);\n}\n.g-icon svg {\n  width: 24px;\n  height: 24px;\n}\n.g-sec--surface .g-icon {\n  background: var(--g-bg);\n}\n.g-sec[data-tone=\"dark\"] .g-icon {\n  background: transparent;\n  color: var(--g-on-dark);\n  border: 1px solid var(--g-on-dark-muted);\n}\n.g-sec :where(h3) {\n  font-size: var(--g-t-20);\n  overflow-wrap: anywhere;\n}\n.g-sec p {\n  overflow-wrap: anywhere;\n}\n\n/* typography polish: balanced headings, no one-word last lines, steady numbers (all progressive: ignored where unsupported) */\n:where([data-gurost-section]) :where(h1, h2, h3) {\n  text-wrap: balance;\n}\n:where([data-gurost-section]) :where(p, li, blockquote) {\n  text-wrap: pretty;\n}\n.g-title,\n.g-hero__title {\n  letter-spacing: -0.01em;\n}\n.g-stats__value,\n.g-pricing__amount,\n.g-prod__amount,\n.g-loc__time,\n.g-hero__trust {\n  font-variant-numeric: tabular-nums lining-nums;\n}\n\n/* Navbar A / B / C. Colours come from palette variables only, except the documented top scrim on C. */\n.g-navbar {\n  position: relative;\n  z-index: 50;\n  background: var(--g-surface);\n  color: var(--g-text);\n  border-bottom: 1px solid var(--g-border);\n}\n.g-navbar[data-tone=\"dark\"] {\n  background: var(--g-dark);\n  color: var(--g-on-dark);\n  border-bottom-color: transparent;\n}\n.g-navbar--sticky {\n  position: sticky;\n  top: 0;\n}\n.g-navbar__inner {\n  min-height: 64px;\n}\n.g-navbar__nav {\n  position: relative;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  min-height: 64px;\n  gap: var(--g-s2);\n}\n.g-navbar__brand {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--g-s1);\n  min-height: var(--g-tap);\n  font-family: var(--g-font-head);\n  font-size: var(--g-t-20);\n  font-weight: 700;\n  line-height: 1.1;\n  overflow-wrap: anywhere;\n}\n.g-navbar__logo {\n  width: 32px;\n  height: 32px;\n  object-fit: contain;\n}\n.g-navbar__panel {\n  display: flex;\n  align-items: center;\n  gap: var(--g-s4);\n}\n.g-navbar__links {\n  display: flex;\n  align-items: center;\n  gap: var(--g-s1);\n}\n.g-navbar__links a {\n  display: inline-flex;\n  align-items: center;\n  min-height: var(--g-tap);\n  padding: 0 var(--g-s1);\n  font-size: var(--g-t-16);\n  font-weight: 600;\n  border-bottom: 2px solid transparent;\n}\n.g-navbar__links a:hover {\n  border-bottom-color: var(--g-primary);\n}\n.g-navbar[data-tone=\"dark\"] .g-navbar__links a:hover {\n  border-bottom-color: var(--g-on-dark);\n}\n.g-navbar__actions {\n  display: flex;\n  align-items: center;\n  gap: var(--g-s2);\n}\n.g-navbar__phone {\n  display: inline-flex;\n  align-items: center;\n  min-height: var(--g-tap);\n  font-weight: 600;\n  white-space: nowrap;\n}\n.g-navbar__cta {\n  white-space: nowrap;\n}\n.g-navbar[data-tone=\"dark\"] .g-btn--primary {\n  background: var(--g-on-dark);\n  color: var(--g-dark);\n}\n\n/* menu button: only exists when the script ran (.g-js) and the screen is small */\n.g-navbar__menu-btn {\n  display: none;\n  position: relative;\n  width: var(--g-tap);\n  height: var(--g-tap);\n  padding: 0;\n  bor
