<!-- Sign Up Form -->
<div class="p-8">
<div class="text-center mb-8">
<h1 class="font-headline-md text-headline-md text-on-background mb-2">Create an Account</h1>
<p class="text-text-muted font-body-md text-body-md">Join Gurost today.</p>
</div>
<div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4 hidden" id="signupError"></div>
<form class="space-y-4" id="signupForm">
<div>
<input class="w-full bg-surface-soft border border-transparent rounded-lg px-4 py-3 text-on-surface focus:border-primary-container focus:ring-0 focus:outline-none transition-colors placeholder:text-text-muted" id="su-name" placeholder="Full Name" type="text"/>
</div>
<div>
<input class="w-full bg-surface-soft border border-transparent rounded-lg px-4 py-3 text-on-surface focus:border-primary-container focus:ring-0 focus:outline-none transition-colors placeholder:text-text-muted" id="su-email" placeholder="Email Address" required="" type="email"/>
</div>
<div>
<input class="w-full bg-surface-soft border border-transparent rounded-lg px-4 py-3 text-on-surface focus:border-primary-container focus:ring-0 focus:outline-none transition-colors placeholder:text-text-muted" id="su-password" placeholder="Password" required="" type="password"/>
</div>
<div>
<input class="w-full bg-surface-soft border border-transparent rounded-lg px-4 py-3 text-on-surface focus:border-primary-container focus:ring-0 focus:outline-none transition-colors placeholder:text-text-muted" id="su-confirm" placeholder="Confirm Password" required="" type="password"/>
</div>
<button class="w-full rounded-lg py-3 mt-6 font-label-bold text-label-bold text-white shadow-md hover:opacity-90 transition-opacity" id="signupSubmit" style="background: linear-gradient(135deg, #FF8C00 0%, #FEB246 100%);" type="submit">
                        Create Account

<span class="text-text-muted text-sm font-label-bold">OR</span>

</div>
<button class="w-full mt-6 rounded-lg py-3 border border-outline-variant bg-transparent text-on-surface font-label-bold text-label-bold hover:bg-surface-container-low transition-colors flex items-center justify-center gap-3" id="googleBtnSignup" type="button">

<script src="shared/api-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const GUROST_SUPABASE_URL = "https://jiadrorezquvthyujykb.supabase.co";
  const GUROST_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImppYWRyb3JlenF1dnRoeXVqeWtiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTI3NzUsImV4cCI6MjA5OTg4ODc3NX0.GWWok3zKSfK3u4Uc3J8MVMhGYiyuZVIi16t6gAppvvs";

  let supabaseClient = null;
  function getSupabaseClient() {
    if (!supabaseClient) supabaseClient = window.supabase.createClient(GUROST_SUPABASE_URL, GUROST_SUPABASE_ANON_KEY);
    return supabaseClient;
  }

  function showError(id, message) {
    const el = document.getElementById(id);
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function hideError(id) {
    document.getElementById(id).classList.add('hidden');
  }

  async function continueWithGoogle() {
    const client = getSupabaseClient();
    await client.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
  }
  document.getElementById('googleBtnSignup').addEventListener('click', continueWithGoogle);

  // Real signup submission - same real call/flow proven working
  // elsewhere on this site, not a new implementation.
  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError('signupError');

    const email = document.getElementById('su-email').value.trim();
    const password = document.getElementById('su-password').value;
    const confirm = document.getElementById('su-confirm').value;

    if (!email || !password || !confirm) {
      return showError('signupError', 'Email and password are required.');
    }
    if (password.length < 8) {
      return showError('signupError', 'Password must be at least 8 characters.');
    }
    if (password !== confirm) {
      return showError('signupError', 'Passwords do not match.');
    }

    const btn = document.getElementById('signupSubmit');
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    try {
      // Real, same honest note as before: Full Name is collected for a
      // better signup experience but isn't sent anywhere yet - the
      // backend signup contract is currently email + password only.
      const result = await GurostAPI.call('/api/auth/signup', { method: 'POST', body: { email, password } });
      localStorage.setItem('gurost_api_key', result.apiKey);
      localStorage.setItem('gurost_user_id', result.userId);
      window.location.href = 'onboarding.html';
    } catch (err) {
      showError('signupError', err.message);
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>
