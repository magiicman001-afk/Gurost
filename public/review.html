<style>
  .review-header { padding: 40px 0 24px; text-align: center; }
  .review-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; padding-bottom: 64px; }
  .preview-box { height: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 13px; }
  .check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .check-icon { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; margin-top: 1px; }
  .check-icon.pass { background: var(--green); }
  .check-icon.fail { background: var(--red); }
  .issue-panel { background: #FBE6E9; border: 1px solid var(--red); border-radius: 8px; padding: 14px; margin-top: 12px; font-size: 13px; }
  .toggle-view { display: flex; gap: 8px; margin-bottom: 16px; }
  .toggle-view button { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: none; cursor: pointer; }
  .toggle-view button.on { border-color: var(--accent); color: var(--accent); }
</style>

<div class="container">
  <div class="review-header">
    <h1 id="reviewTitle" style="font-size:26px;">Checking your build…</h1>
  </div>

  <div class="review-grid">
    <div class="preview-box" id="previewBox">Loading preview…</div>

    <div class="card">
      <div id="checklist"><p class="text-dim">Loading…</p></div>
      <a href="#" class="btn btn-primary btn-block mt-24" id="deployBtn" style="display:none;">Deploy Now</a>
    </div>
  </div>
</div>

<script src="shared/api-client.js"></script>
<script>
  const projectId = new URLSearchParams(window.location.search).get('projectId');

  function checkRow(pass, label) {
    return `<div class="check-item"><div class="check-icon ${pass ? 'pass' : 'fail'}">${pass ? '&#10003;' : '!'}</div>${label}</div>`;
  }

  async function loadReview() {
    if (!GurostAPI.requireLogin()) return;
    if (!projectId) {
      document.getElementById('reviewTitle').textContent = 'No project selected';
      return;
    }

    try {
      const p = await GurostAPI.call(`/api/project/${projectId}`);

      const previewBox = document.getElementById('previewBox');
      if (p.currentHtml) {
        previewBox.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.style.cssText = 'width:100%;height:100%;border:none;';
        iframe.sandbox = 'allow-scripts allow-forms';
        iframe.srcdoc = p.currentHtml;
        previewBox.appendChild(iframe);
      }

      const checklist = document.getElementById('checklist');
      const deployBtn = document.getElementById('deployBtn');
      deployBtn.href = `deploy.html?projectId=${projectId}`;
      deployBtn.style.display = 'block';

      if (p.type === 'app' && p.codeReview) {
        const critical = p.codeReview.hasCritical;
        const sandboxPass = p.sandboxResult?.pass !== false;
        checklist.innerHTML =
          checkRow(!critical, critical ? `Code review — ${p.codeReview.remainingIssues.length} issue(s) found` : 'Code review passed') +
          checkRow(sandboxPass, sandboxPass ? 'Sandbox test passed' : 'Sandbox test failed') +
          checkRow(true, 'Frontend ready for Vercel') +
          checkRow(true, 'Backend ready for Render') +
          checkRow(true, 'Database schema ready');

        if (critical) {
          const issue = p.codeReview.remainingIssues[0];
          checklist.innerHTML += `<div class="issue-panel"><strong>${issue.severity}:</strong> ${issue.description}<br><span class="text-dim">Suggested fix: ${issue.suggestion || 'see full report'}</span></div>`;
          document.getElementById('reviewTitle').textContent = 'Resolve issues to deploy';
          deployBtn.classList.remove('btn-primary'); deployBtn.classList.add('btn-outline');
          deployBtn.textContent = 'Deploy will re-check and may block';
        } else {
          document.getElementById('reviewTitle').textContent = 'Ready to launch';
        }
      } else {
        checklist.innerHTML = checkRow(true, 'Site generated') + checkRow(true, 'Ready for Vercel');
        document.getElementById('reviewTitle').textContent = 'Ready to launch';
      }
    } catch (err) {
      document.getElementById('reviewTitle').textContent = 'Could not load project';
      document.getElementById('checklist').innerHTML = `<p class="text-dim">${err.message}</p>`;
    }
  }

  document.addEventListener('DOMContentLoaded', loadReview);
</script>
