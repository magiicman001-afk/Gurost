<script>
  // Carries whatever's typed in the hero input through to whichever
  // builder page the user clicks, using the same localStorage handoff
  // key (gurost_pending_generate) that onboarding.html/templates.html
  // already use for website-mode — app-builder.html now reads this
  // same key for app-mode too.
  function wireHandoff(buttonId, mode) {
    const btn = document.getElementById(buttonId);
    if (!btn) return;
    btn.addEventListener('click', () => {
      const idea = document.getElementById('heroIdeaInput').value.trim();
      if (idea) {
        localStorage.setItem('gurost_pending_generate', JSON.stringify({ prompt: idea, mode }));
      }
      // No preventDefault — the real href navigation still happens
      // normally; this just makes sure the typed idea travels with it
      // when there is one.
    });
  }

  // Separate from wireHandoff above — Amend Website needs a URL, not a
  // prompt+mode pair, so it gets its own key rather than overloading
  // gurost_pending_generate with a shape it doesn't expect.
  function wireAmendHandoff(buttonId) {
    const btn = document.getElementById(buttonId);
    if (!btn) return;
    btn.addEventListener('click', () => {
      const url = document.getElementById('heroIdeaInput').value.trim();
      if (url) {
        localStorage.setItem('gurost_pending_amend', JSON.stringify({ url }));
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    wireHandoff('buildAppBtn', 'app');
    wireHandoff('buildWebsiteBtn', 'website');
    wireAmendHandoff('amendWebsiteBtn');

    // Real, not a demo — only shows/connects if an actual meeting
    // session ID is present. Nothing here invents one.
    const activeSessionId = localStorage.getItem('gurost_active_meeting_session');
    if (activeSessionId) {
      const wrap = document.getElementById('copilotIndicatorWrap');
      wrap.style.display = 'flex';
      attachCopilotIndicator(wrap, activeSessionId);
    }
  });
</script>
