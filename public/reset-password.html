<script>
  function showError(id, message) {
    const el = document.getElementById(id);
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function hideError(id) {
    document.getElementById(id).classList.add('hidden');
  }

  // Real submission, identical real call already proven working in
  // signup.html's own inline forgot-password panel - deliberately
  // succeeds the same way whether or not the email has a real account,
  // matching user-auth.js's requestPasswordReset() on purpose (see
  // that file for why - confirming which emails have real accounts is
  // its own information leak).
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError('resetError');
    document.getElementById('resetSuccess').classList.add('hidden');

    const email = document.getElementById('reset-email').value.trim();
    if (!email) return showError('resetError', 'Enter your email first.');

    const btn = document.getElementById('resetSubmit');
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Sending…';

    try {
      await GurostAPI.call('/api/auth/forgot-password', { method: 'POST', body: { email } });
      const success = document.getElementById('resetSuccess');
      success.textContent = "If that email has an account, a reset link is on its way. Check your inbox.";
      success.classList.remove('hidden');
    } catch (err) {
      showError('resetError', err.message);
    } finally {
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Send Reset Link';
    }
  });
</script>
