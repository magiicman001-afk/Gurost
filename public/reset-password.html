<!-- Logo Top Left -->

</a>
<!-- Back Button Top Right -->
<a class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-soft border border-outline-variant text-on-surface-variant hover:text-primary transition-colors" href="login.html">
<span class="material-symbols-outlined">arrow_back</span>
</a>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-gutter pt-16 pb-section-gap w-full">
<div class="w-full max-w-md relative z-10">
<!-- Form Card -->
<div class="glass-panel ambient-shadow rounded-lg p-8 md:p-12 text-center border border-surface-container-highest">
<!-- Center Icon -->
<div class="w-16 h-16 mx-auto mb-6 bg-primary-container/10 rounded-full flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined text-3xl">lock_reset</span>
</div>
<!-- Headers -->
<h1 class="font-headline-md text-headline-md text-on-background mb-2">Reset Password</h1>
<p class="font-body-md text-body-md text-text-muted mb-8 px-4">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
<!-- Form -->
<div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 hidden text-left mb-4" id="resetError"></div>
<div class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-4 py-3 hidden text-left mb-4" id="resetSuccess"></div>
<form class="space-y-6 text-left" id="resetForm">
<!-- Email Input -->
<div>
<label class="sr-only" for="reset-email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-text-muted">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-surface-soft border border-outline-variant rounded-lg font-body-md text-on-background focus:outline-none focus:ring-0 focus:border-primary-container transition-colors placeholder-text-muted" id="reset-email" name="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-3 px-4 rounded-lg btn-gradient text-white font-label-bold text-label-bold flex items-center justify-center gap-2 hover:opacity-90 transition-opacity ambient-shadow" id="resetSubmit" type="submit">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Back to Login Link -->
<div class="mt-8">
<a class="inline-flex items-center justify-center gap-2 font-label-bold text-label-bold text-primary hover:text-primary-container transition-colors" href="login.html">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                        Back to Login
                    </a>
</div>
</div>
</div>
</main>
<!-- Global Footer -->
<footer class="w-full bg-on-background text-surface-container-lowest py-8 px-gutter mt-auto z-10 relative">
<div class="max-w-container-max-width mx-auto flex flex-col items-center justify-center text-center">

            </p>

<script src="shared/api-client.js"></script>
<script>
  function showError(id, message) {
    const el = document.getElementById(id);
    el.textContent = message;
    el.classList.remove('hidden');
  }
  function hideError(id) {
    document.getElementById(id).classList.add('hidden');
  }

  // Real submission, identical real call already proven working
  // elsewhere - deliberately succeeds the same way whether or not the
  // email has a real account, matching user-auth.js's
  // requestPasswordReset() on purpose (confirming which emails have
  // real accounts is its own information leak).
  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideError('resetError');
    document.getElementById('resetSuccess').classList.add('hidden');

    const email = document.getElementById('reset-email').value.trim();
    if (!email) return showError('resetError', 'Enter your email first.');

    const btn = document.getElementById('resetSubmit');
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Sending…';

    try {
      await GurostAPI.call('/api/auth/forgot-password', { method: 'POST', body: { email } });
      const success = document.getElementById('resetSuccess');
      success.textContent = "If that email has an account, a reset link is on its way. Check your inbox.";
      success.classList.remove('hidden');
    } catch (err) {
      showError('resetError', err.message);
    } finally {
      btn.disabled = false;
      btn.querySelector('span').textContent = 'Send Reset Link';
    }
  });
</script>
